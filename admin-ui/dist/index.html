<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <title>Medusa Admin - Mèo Cưng</title>
        <link rel="icon" href="data:," data-placeholder-favicon />
        <!-- Rewrite fetch to proxy /admin and /auth requests to Medusa Backend -->
        <script>
          const MEDUSA_BACKEND = "https://meocung-medusa.onrender.com";
          const originalFetch = window.fetch;
          window.fetch = function(url, options = {}) {
            if (typeof url === 'string') {
              if (url.startsWith('/admin') || url.startsWith('/auth') || url.startsWith('/store')) {
                url = MEDUSA_BACKEND + url;
                options.credentials = options.credentials || 'include';
              }
            }
            return originalFetch(url, options);
          };
        </script>
        <script type="module" crossorigin src="/assets/index-DfD3voTe.js"></script>
        <link rel="stylesheet" crossorigin href="/assets/index-BoaOhaCh.css">
    </head>
    <body>
        <div id="medusa"></div>
    </body>
</html>
