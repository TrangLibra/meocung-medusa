<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mèo Cưng Admin Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2'><path d='M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 4 .58 5.4 1 1.4 1.5 3.3 1.5 5.6 0 5.5-3.8 8.5-8.5 8.5s-8.5-3-8.5-8.5c0-2.3.5-4.2 1.5-5.6 1-1.4-.82-4.82.58-5.4 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z'/></svg>" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM & Babel for zero-config in-browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 p-0">
  <div id="root">
    <!-- Fallback loader -->
    <div class="flex h-screen w-screen items-center justify-center bg-slate-50">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm font-semibold text-slate-600">Đang khởi tạo Mèo Cưng Admin Dashboard...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const MEDUSA_BACKEND_URL = "https://meocung-medusa.onrender.com";
    const PAYLOAD_ADMIN_URL = "https://meocung-payload.vercel.app/admin";

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [serverStatus, setServerStatus] = useState('checking');

      const fetchProducts = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${MEDUSA_BACKEND_URL}/store/products?limit=20`);
          if (res.ok) {
            const data = await res.json();
            setProducts(data.products || []);
            setServerStatus('online');
          } else {
            setServerStatus('offline');
          }
        } catch (err) {
          console.error("Error connecting to Medusa:", err);
          setServerStatus('offline');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchProducts();
      }, []);

      const filteredProducts = products.filter(p => 
        (p.title || '').toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-slate-50 font-sans">
          {/* SIDEBAR */}
          <aside className="w-64 border-r border-slate-200 bg-white flex flex-col justify-between shrink-0">
            <div>
              {/* Logo Brand */}
              <div className="p-6 flex items-center gap-3 border-b border-slate-100">
                <div className="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center shadow-md shadow-orange-500/20 font-bold text-lg">
                  🐾
                </div>
                <div>
                  <h1 className="font-bold text-slate-800 text-lg leading-tight">Mèo Cưng</h1>
                  <p className="text-xs text-orange-600 font-semibold tracking-wide uppercase">Admin Dashboard</p>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="p-4 space-y-1.5">
                <div className="px-3 py-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                  E-Commerce (Medusa v2)
                </div>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'dashboard'
                      ? 'bg-orange-50 text-orange-700 font-semibold'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }`}
                >
                  <span className="text-base">📊</span>
                  Tổng Quan (Analytics)
                </button>
                <button
                  onClick={() => setActiveTab('products')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'products'
                      ? 'bg-orange-50 text-orange-700 font-semibold'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }`}
                >
                  <span className="text-base">📦</span>
                  Sản Phẩm & Kho Hạt
                  <span className="ml-auto text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-500 font-normal">
                    {products.length}
                  </span>
                </button>
                <button
                  onClick={() => setActiveTab('orders')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'orders'
                      ? 'bg-orange-50 text-orange-700 font-semibold'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }`}
                >
                  <span className="text-base">🛒</span>
                  Đơn Hàng (Orders)
                </button>

                <div className="pt-4 px-3 py-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                  Content Management (CMS)
                </div>
                <button
                  onClick={() => setActiveTab('payload')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'payload'
                      ? 'bg-orange-50 text-orange-700 font-semibold'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }`}
                >
                  <span className="text-base">📝</span>
                  PayloadCMS (iFrame)
                  <span className="ml-auto text-[10px] bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded">
                    Live
                  </span>
                </button>
              </nav>
            </div>

            {/* Backend Status indicator */}
            <div className="p-4 border-t border-slate-100 bg-slate-50/50">
              <div className="flex items-center justify-between text-xs mb-2">
                <span className="text-slate-500 font-medium">Medusa Core v2:</span>
                {serverStatus === 'online' && (
                  <span className="inline-flex items-center gap-1.5 text-emerald-600 font-semibold">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Live 🟢
                  </span>
                )}
                {serverStatus === 'checking' && (
                  <span className="inline-flex items-center gap-1.5 text-amber-600 font-medium">
                    Đang kết nối...
                  </span>
                )}
                {serverStatus === 'offline' && (
                  <span className="inline-flex items-center gap-1.5 text-rose-600 font-semibold">
                    Render Sleep
                  </span>
                )}
              </div>
              <a
                href="https://meocung-ecommerce-seven.vercel.app"
                target="_blank"
                rel="noreferrer"
                className="w-full flex items-center justify-center gap-2 py-2 px-3 text-xs font-semibold text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 shadow-sm"
              >
                <span>↗</span> Xem Storefront
              </a>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* TOP BAR */}
            <header className="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3">
                <h2 className="text-xl font-bold text-slate-800 capitalize">
                  {activeTab === 'dashboard' && 'Tổng Quan Kinh Doanh'}
                  {activeTab === 'products' && 'Quản Lý Sản Phẩm (MedusaJS v2)'}
                  {activeTab === 'orders' && 'Quản Lý Đơn Hàng'}
                  {activeTab === 'payload' && 'Quản Trị Nội Dung (PayloadCMS 3.0)'}
                </h2>
              </div>

              <div className="flex items-center gap-4">
                <button
                  onClick={fetchProducts}
                  className="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-100 border border-slate-200 shadow-sm transition-colors flex items-center gap-1.5"
                >
                  <span>🔄</span> {loading ? 'Đang tải...' : 'Làm mới'}
                </button>
                <div className="w-9 h-9 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-sm border border-orange-200">
                  MC
                </div>
              </div>
            </header>

            {/* BODY TABS */}
            <div className="flex-1 overflow-auto bg-slate-50 p-6">
              {/* TAB 1: DASHBOARD OVERVIEW */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  {/* Stat Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Tổng Sản Phẩm
                        <span className="text-base">📦</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">{products.length}</div>
                      <p className="text-xs text-emerald-600 mt-1">Đồng bộ từ Medusa Core v2</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Bài Viết Cẩm Nang
                        <span className="text-base">📝</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">100+</div>
                      <p className="text-xs text-blue-600 mt-1">Quản lý trên PayloadCMS</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Doanh Thu Đơn Hàng
                        <span className="text-base">💰</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">0 ₫</div>
                      <p className="text-xs text-slate-400 mt-1">Sẵn sàng nhận thanh toán</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Database Neon
                        <span className="text-base">🐘</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">PostgreSQL</div>
                      <p className="text-xs text-purple-600 mt-1">Serverless Cloud Pooler</p>
                    </div>
                  </div>

                  {/* Quick Table Preview */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-5 border-b border-slate-100 flex items-center justify-between">
                      <h3 className="font-bold text-slate-800">Sản phẩm tiêu biểu từ Medusa Catalog</h3>
                      <button
                        onClick={() => setActiveTab('products')}
                        className="text-xs font-semibold text-orange-600 hover:text-orange-700"
                      >
                        Xem tất cả ({products.length}) ➔
                      </button>
                    </div>
                    <div className="divide-y divide-slate-100">
                      {products.slice(0, 5).map((p) => (
                        <div key={p.id} className="p-4 flex items-center gap-4 hover:bg-slate-50/50 transition-colors">
                          <div className="w-12 h-12 rounded-lg bg-orange-50 border border-orange-100 flex items-center justify-center overflow-hidden shrink-0">
                            {p.thumbnail ? (
                              <img src={p.thumbnail} alt={p.title} className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-xl">🐱</span>
                            )}
                          </div>
                          <div className="flex-1 min-w-0">
                            <p className="font-semibold text-slate-800 text-sm truncate">{p.title}</p>
                            <p className="text-xs text-slate-400 truncate">{p.description || 'Chưa có mô tả chi tiết'}</p>
                          </div>
                          <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-mono">
                            {p.id.slice(0, 14)}...
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: PRODUCTS TABLE */}
              {activeTab === 'products' && (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden max-w-7xl mx-auto">
                  <div className="p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div className="relative flex-1 max-w-md">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="🔍 Tìm theo tên sản phẩm hạt, pate..."
                        className="w-full px-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500"
                      />
                    </div>
                    <div className="flex items-center gap-3">
                      <button 
                        onClick={() => setActiveTab('payload')}
                        className="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm transition-colors"
                      >
                        <span>✏️</span> Chỉnh Content Với PayloadCMS
                      </button>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-slate-100 bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                          <th className="py-3.5 px-6">Sản Phẩm</th>
                          <th className="py-3.5 px-6">Danh Mục</th>
                          <th className="py-3.5 px-6">Biến Thể</th>
                          <th className="py-3.5 px-6">Trạng Thái</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-sm">
                        {filteredProducts.map((p) => (
                          <tr key={p.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="py-4 px-6 flex items-center gap-3.5">
                              <div className="w-10 h-10 rounded-lg bg-orange-50 border border-orange-100 flex items-center justify-center overflow-hidden shrink-0">
                                {p.thumbnail ? (
                                  <img src={p.thumbnail} alt={p.title} className="w-full h-full object-cover" />
                                ) : (
                                  <span className="text-lg">🐱</span>
                                )}
                              </div>
                              <div>
                                <div className="font-semibold text-slate-800">{p.title}</div>
                                <div className="text-xs text-slate-400 font-mono">{p.id}</div>
                              </div>
                            </td>
                            <td className="py-4 px-6 text-slate-600">
                              {p.collection?.title || 'Thức ăn mèo'}
                            </td>
                            <td className="py-4 px-6 text-slate-600">
                              <span className="text-xs bg-slate-100 px-2 py-1 rounded font-medium">
                                {p.variants?.length || 1} biến thể
                              </span>
                            </td>
                            <td className="py-4 px-6">
                              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                Hoạt động
                              </span>
                            </td>
                          </tr>
                        ))}
                        {filteredProducts.length === 0 && (
                          <tr>
                            <td colSpan="4" className="py-12 text-center text-slate-400">
                              Không tìm thấy sản phẩm nào phù hợp.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 3: ORDERS */}
              {activeTab === 'orders' && (
                <div className="bg-white p-12 rounded-xl border border-slate-200 shadow-sm text-center max-w-2xl mx-auto space-y-4">
                  <div className="w-16 h-16 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center mx-auto text-2xl">
                    🛒
                  </div>
                  <h3 className="text-lg font-bold text-slate-800">Danh Sách Đơn Hàng Mèo Cưng</h3>
                  <p className="text-sm text-slate-500">
                    Hệ thống đang sẵn sàng tiếp nhận các đơn đặt hàng mới từ khách qua Next.js Storefront.
                  </p>
                  <a
                    href="https://meocung-ecommerce-seven.vercel.app"
                    target="_blank"
                    rel="noreferrer"
                    className="inline-flex items-center gap-2 px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors"
                  >
                    Đặt Thử Đơn Hàng Trên Storefront ➔
                  </a>
                </div>
              )}

              {/* TAB 4: PAYLOADCMS IFRAME INTEGRATION (THEO CHỈ ĐẠO CỦA MENTOR) */}
              {activeTab === 'payload' && (
                <div className="w-full h-[calc(100vh-120px)] bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                  <div className="p-3 bg-slate-100/70 border-b border-slate-200 flex items-center justify-between text-xs px-4">
                    <div className="flex items-center gap-2 text-slate-600 font-medium">
                      <span>📝</span>
                      Nhúng trực tiếp giao diện quản trị <strong>PayloadCMS 3.0</strong> qua iFrame
                    </div>
                    <a
                      href={PAYLOAD_ADMIN_URL}
                      target="_blank"
                      rel="noreferrer"
                      className="text-orange-600 hover:text-orange-700 font-semibold"
                    >
                      Mở tab mới ↗
                    </a>
                  </div>
                  <iframe
                    src={PAYLOAD_ADMIN_URL}
                    className="w-full flex-1 border-0"
                    title="PayloadCMS Admin"
                  />
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
