        description: "Đồ chơi kích thích phản xạ săn mồi tự nhiên, giúp mèo vận động giảm béo phì và gắn kết tình cảm với sen."

    function App() {
      const [activeTab, setActiveTab] = useState('products');
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [sourceInfo, setSourceInfo] = useState('Đang kết nối...');

      // State cho Modal Thêm/Sửa
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        category: 'thuc-an-hat',
        price: 100000,
        originalPrice: 120000,
        weight: '1kg',
        image: 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
        description: '',
        inStock: true
      });

      // Tải sản phẩm từ LocalStorage / Storefront
      const loadProducts = async () => {
        setLoading(true);
        try {
          const localSaved = localStorage.getItem('mc_admin_products') || localStorage.getItem('gh_admin_products');
          if (localSaved) {
            const parsed = JSON.parse(localSaved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setProducts(parsed);
              setSourceInfo('Đồng bộ Realtime (8 Sản phẩm)');
              setLoading(false);
              return;
            }
          }
        } catch (_) {}

        // Mặc định nạp đủ 8 sản phẩm chuẩn
        setProducts(DEFAULT_PRODUCTS);
        localStorage.setItem('mc_admin_products', JSON.stringify(DEFAULT_PRODUCTS));
        setSourceInfo('Đầy đủ 8 Sản Phẩm Chuẩn');
        setLoading(false);
      };

      useEffect(() => {
        loadProducts();
      }, []);

      const saveProductList = (updatedList) => {
        setProducts(updatedList);
        localStorage.setItem('mc_admin_products', JSON.stringify(updatedList));
        localStorage.setItem('gh_admin_products', JSON.stringify(updatedList));
        window.dispatchEvent(new Event('storage'));
      };

      const handleOpenCreate = () => {
        setEditingProduct(null);
        setFormData({
          name: '',
          category: 'thuc-an-hat',
          price: 150000,
          originalPrice: 180000,
          weight: '1kg',
          image: 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
          description: '',
          inStock: true
        });
        setIsModalOpen(true);
      };

      const handleOpenEdit = (p) => {
        setEditingProduct(p);
        setFormData({
          name: p.name || p.title || '',
          category: p.categorySlug || p.category || 'thuc-an-hat',
          price: p.price || 100000,
          originalPrice: p.originalPrice || Math.round((p.price || 100000) * 1.2),
          weight: p.weight || '1kg',
          image: p.image || p.thumbnail || 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
          description: p.description || '',
          inStock: p.inStock !== false
        });
        setIsModalOpen(true);
      };

      const handleDelete = (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) return;
        const updated = products.filter(p => p.id !== id);
        saveProductList(updated);
      };

      const handleSaveSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) return alert('Vui lòng nhập tên sản phẩm!');

        const categoryNames = {
          'thuc-an-hat': 'Thức ăn hạt',
          'pate-cho-meo': 'Pate cho mèo',
          'cat-ve-sinh': 'Cát vệ sinh',
          'phu-kien': 'Phụ kiện & Đồ chơi'
        };

        if (editingProduct) {
          const updated = products.map(p => {
            if (p.id === editingProduct.id) {
              return {
                ...p,
                name: formData.name,
                title: formData.name,
                category: formData.category,
                categorySlug: formData.category,
                categoryName: categoryNames[formData.category] || 'Sản phẩm',
                price: Number(formData.price),
                originalPrice: Number(formData.originalPrice),
                weight: formData.weight,
                image: formData.image,
                thumbnail: formData.image,
                description: formData.description,
                inStock: formData.inStock
              };
            }
            return p;
          });
          saveProductList(updated);
        } else {
          const newId = `p_${Date.now()}`;
          const newProd = {
            id: newId,
            name: formData.name,
            title: formData.name,
            slug: `san-pham-${Date.now()}`,
            category: formData.category,
            categorySlug: formData.category,
            categoryName: categoryNames[formData.category] || 'Sản phẩm',
            price: Number(formData.price),
            originalPrice: Number(formData.originalPrice),
            weight: formData.weight,
            image: formData.image,
            thumbnail: formData.image,
            description: formData.description,
            inStock: formData.inStock,
            rating: 5.0,
            soldCount: 0
          };
          const updated = [newProd, ...products];
          saveProductList(updated);
        }

        setIsModalOpen(false);
      };

      const filteredProducts = products.filter(p => {
        const title = (p.name || p.title || '').toLowerCase();
        return title.includes(searchQuery.toLowerCase());
      });

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-slate-50 font-sans">

                >

                  Quản Lý Sản Phẩm
                  <span className="ml-auto text-xs bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded-full">

                </button>
                <button

                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'

                <button

              >
                <span>↗</span> Xem Storefront Mèo Cưng
              </a>
            </div>
          </aside>

          {/* MAIN VIEW */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header className="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3">
                <h2 className="text-xl font-bold text-slate-800">
                  {activeTab === 'products' && 'Quản Lý Danh Mục Sản Phẩm (Thêm - Xóa - Sửa)'}

                  {activeTab === 'payload' && 'Quản Trị Nội Dung PayloadCMS 3.0'}
                </h2>
              </div>

              <div className="flex items-center gap-3">
                {activeTab === 'products' && (
                  <button
                    onClick={handleOpenCreate}
                    className="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm transition-colors"
                  >
                    <span>➕</span> Thêm Sản Phẩm Mới
                  </button>
                )}
                <button

                  className="px-3 py-2 text-xs font-semibold text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-100 border border-slate-200 shadow-sm transition-colors"
                >
                  <span>🔄</span> {loading ? 'Đang tải...' : 'Đồng bộ'}
                </button>
              </div>
            </header>

            <div className="flex-1 overflow-auto bg-slate-50 p-6">
              {activeTab === 'products' && (
                <div className="space-y-4 max-w-7xl mx-auto">
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="relative flex-1 max-w-md">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="🔍 Tìm kiếm sản phẩm hạt, pate, cát..."
                        className="w-full px-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500"
                      />
                    </div>
                    <div className="text-xs text-slate-500 font-medium">
                      Hiển thị <strong>{filteredProducts.length}</strong> / <strong>{products.length}</strong> sản phẩm
                    </div>
                  </div>

                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-slate-100 bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                            <th className="py-3.5 px-6">Ảnh & Tên Sản Phẩm</th>
                            <th className="py-3.5 px-6">Danh Mục</th>
                            <th className="py-3.5 px-6">Giá Bán</th>
                            <th className="py-3.5 px-6">Trọng Lượng</th>
                            <th className="py-3.5 px-6">Trạng Thái</th>
                            <th className="py-3.5 px-6 text-right">Thao Tác</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-sm">
                          {filteredProducts.map((p) => {
                            const name = p.name || p.title || 'Sản phẩm không tên';
                            const image = p.image || p.thumbnail || 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800';
                            const price = Number(p.price) || 0;
                            const cat = p.categoryName || p.categorySlug || p.category || 'Thức ăn mèo';

                            return (
                              <tr key={p.id} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-4 px-6 flex items-center gap-3.5">
                                  <div className="w-12 h-12 rounded-lg bg-orange-50 border border-orange-100 flex items-center justify-center overflow-hidden shrink-0">
                                    <img src={image} alt={name} className="w-full h-full object-cover" />
                                  </div>
                                  <div className="min-w-0">
                                    <div className="font-semibold text-slate-800 line-clamp-1">{name}</div>
                                    <div className="text-xs text-slate-400 font-mono">ID: {p.id}</div>
                                  </div>
                                </td>
                                <td className="py-4 px-6">
                                  <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md font-medium">
                                    {cat}
                                  </span>
                                </td>
                                <td className="py-4 px-6">
                                  <span className="font-bold text-orange-600">
                                    {price.toLocaleString('vi-VN')} ₫
                                  </span>
                                  {p.originalPrice && (
                                    <div className="text-xs text-slate-400 line-through">
                                      {Number(p.originalPrice).toLocaleString('vi-VN')} ₫
                                    </div>
                                  )}
                                </td>
                                <td className="py-4 px-6 text-slate-600">
                                  {p.weight || '1kg'}
                                </td>
                                <td className="py-4 px-6">
                                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Còn hàng
                                  </span>
                                </td>
                                <td className="py-4 px-6 text-right space-x-2">
                                  <button
                                    onClick={() => handleOpenEdit(p)}
                                    className="px-3 py-1.5 text-xs font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors"
                                  >
                                    ✏️ Sửa
                                  </button>
                                  <button
                                    onClick={() => handleDelete(p.id)}
                                    className="px-3 py-1.5 text-xs font-semibold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 rounded-lg transition-colors"
                                  >
                                    🗑️ Xóa
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'dashboard' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Sản Phẩm Trong Kho
                        <span className="text-base">📦</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">{products.length}</div>
                      <p className="text-xs text-emerald-600 mt-1">Đầy đủ hạt, pate, cát, đồ chơi</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Bài Cẩm Nang Nuôi Mèo
                        <span className="text-base">📝</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">100+</div>
                      <p className="text-xs text-blue-600 mt-1">Quản lý trên PayloadCMS</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Liên Kết Realtime
                        <span className="text-base">🔗</span>
                      </div>
                      <div className="text-2xl font-bold text-emerald-600 mt-2">Đồng bộ</div>
                      <p className="text-xs text-slate-400 mt-1">Admin ➔ Storefront 100%</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Database Neon
                        <span className="text-base">🐘</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">PostgreSQL</div>
                      <p className="text-xs text-purple-600 mt-1">Serverless Cloud Pooler</p>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'payload' && (
                <div className="w-full h-[calc(100vh-120px)] bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                  <div className="p-3 bg-slate-100/70 border-b border-slate-200 flex items-center justify-between text-xs px-4">
                    <div className="flex items-center gap-2 text-slate-600 font-medium">
                      <span>📝</span>
                      Giao diện <strong>PayloadCMS 3.0</strong> (Quản lý 100 bài viết cẩm nang & Banners)
                    </div>
                    <a
                      href={PAYLOAD_ADMIN_URL}
                      target="_blank"
                      rel="noreferrer"
                      className="text-orange-600 hover:text-orange-700 font-semibold"
                    >
                      Mở trang quản trị gốc ↗
                    </a>
                  </div>
                  <iframe
                    src={PAYLOAD_ADMIN_URL}
                    className="w-full flex-1 border-0"
                    title="PayloadCMS Admin"
                  />
                </div>
              )}
            </div>
          </main>

          {/* MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-100 overflow-hidden">
                <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="font-bold text-lg text-slate-800">
                    {editingProduct ? '✏️ Chỉnh Sửa Sản Phẩm' : '➕ Thêm Sản Phẩm Mới'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveSubmit} className="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Tên sản phẩm *</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder="VD: Hạt Royal Canin Indoor 2kg"
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Danh mục</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none bg-white"
                      >
                        <option value="thuc-an-hat">Thức ăn hạt</option>
                        <option value="pate-cho-meo">Pate cho mèo</option>
                        <option value="cat-ve-sinh">Cát vệ sinh</option>
                        <option value="phu-kien">Phụ kiện & Đồ chơi</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Trọng lượng</label>
                      <input
                        type="text"
                        value={formData.weight}
                        onChange={(e) => setFormData({ ...formData, weight: e.target.value })}
                        placeholder="VD: 2kg, 85g, 6L"
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Giá bán (VNĐ) *</label>
                      <input
                        type="number"
                        required
                        value={formData.price}
                        onChange={(e) => setFormData({ ...formData, price: e.target.value })}
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none font-semibold text-orange-600"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Giá gốc</label>
                      <input
                        type="number"
                        value={formData.originalPrice}
                        onChange={(e) => setFormData({ ...formData, originalPrice: e.target.value })}
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Đường dẫn ảnh sản phẩm (URL)</label>
                    <input
                      type="url"
                      value={formData.image}
                      onChange={(e) => setFormData({ ...formData, image: e.target.value })}
                      placeholder="https://..."
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                    />
                  </div>

                  <div className="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg"
                    >
                      Hủy bỏ
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-sm font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm"
                    >
                      Lưu Sản Phẩm
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
