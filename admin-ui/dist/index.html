<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mèo Cưng Admin Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2'><path d='M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 4 .58 5.4 1 1.4 1.5 3.3 1.5 5.6 0 5.5-3.8 8.5-8.5 8.5s-8.5-3-8.5-8.5c0-2.3.5-4.2 1.5-5.6 1-1.4-.82-4.82.58-5.4 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 p-0">
  <div id="root">
    <div class="flex h-screen w-screen items-center justify-center bg-slate-50">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm font-semibold text-slate-600">Đang khởi tạo Mèo Cưng Admin Dashboard...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const STOREFRONT_URL = "https://meocung-ecommerce-seven.vercel.app";
    const PAYLOAD_API_URL = "https://meocung-payload.vercel.app/api";
    const PAYLOAD_ADMIN_URL = "https://meocung-payload.vercel.app/admin";

    // Danh sách sản phẩm mặc định chuẩn shop Mèo Cưng
    const DEFAULT_PRODUCTS = [
      {
        id: "p1",
        name: "Thức Ăn Hạt Royal Canin Cho Mèo Trưởng Thành (Fit 32)",
        category: "thuc-an-hat",
        categoryName: "Thức ăn hạt",
        price: 185000,
        originalPrice: 215000,
        image: "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800&auto=format&fit=crop&q=80",
        weight: "2kg",
        inStock: true,
        description: "Thức ăn hạt Royal Canin Fit 32 cung cấp đầy đủ 52 dưỡng chất thiết yếu, ngừa sỏi thận và búi lông."
      },
      {
        id: "p2",
        name: "Hạt Cho Mèo Reflex Plus Vị Cá Hồi & Gạo (Salmon Adult)",
        category: "thuc-an-hat",
        categoryName: "Thức ăn hạt",
        price: 155000,
        originalPrice: 175000,
        image: "https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=800&auto=format&fit=crop&q=80",
        weight: "1.5kg",
        inStock: true,
        description: "Hạt Reflex Plus công thức Thổ Nhĩ Kỳ với Omega 3 & 6 dưỡng lông bóng mượt."
      },
      {
        id: "p3",
        name: "Pate Mèo Ciao Churu Dạng Tuýp Súp Thưởng (Gói 4 thanh)",
        category: "pate-cho-meo",
        categoryName: "Pate cho mèo",
        price: 45000,
        originalPrice: 55000,
        image: "https://images.unsplash.com/photo-1574158622682-e40e69881006?w=800&auto=format&fit=crop&q=80",
        weight: "14g x 4 thanh",
        inStock: true,
        description: "Súp thưởng Ciao Churu bổ sung nước, thơm ngon tuyệt đỉnh kích thích mèo kén ăn."
      },
      {
        id: "p4",
        name: "Pate Whiskas Vị Cá Thu Cho Mèo 85g",
        category: "pate-cho-meo",
        categoryName: "Pate cho mèo",
        price: 18000,
        originalPrice: 22000,
        image: "https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800&auto=format&fit=crop&q=80",
        weight: "85g",
        inStock: true,
        description: "Pate Whiskas gói 85g giàu đạm và vitamin thiết yếu cho mèo phát triển toàn diện."
      },
      {
        id: "p5",
        name: "Cát Vệ Sinh Đậu Nành Tofu Cature Khử Mùi Hữu Cơ 6L",
        category: "cat-ve-sinh",
        categoryName: "Cát vệ sinh",
        price: 135000,
        originalPrice: 160000,
        image: "https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800&auto=format&fit=crop&q=80",
        weight: "Túi 6L (2.4kg)",
        inStock: true,
        description: "Cát đậu nành hữu cơ Cature tan trong bồn cầu, khử mùi 100%, không bụi."
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('products');
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [sourceInfo, setSourceInfo] = useState('Đang kết nối...');

      // State cho Modal Thêm/Sửa
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        category: 'thuc-an-hat',
        price: 100000,
        originalPrice: 120000,
        weight: '1kg',
        image: 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
        description: '',
        inStock: true
      });

      // Tải sản phẩm từ Storefront / PayloadCMS / LocalStorage
      const loadProducts = async () => {
        setLoading(true);
        try {
          // 1. Kiểm tra cache localStorage người dùng vừa sửa
          const localSaved = localStorage.getItem('mc_admin_products');
          if (localSaved) {
            const parsed = JSON.parse(localSaved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setProducts(parsed);
              setSourceInfo('Đồng bộ Realtime (Local + Storefront)');
              setLoading(false);
              return;
            }
          }

          // 2. Kéo trực tiếp từ API Storefront Vercel
          const res = await fetch(`${STOREFRONT_URL}/api/medusa/products`, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.products) && data.products.length > 0) {
              setProducts(data.products);
              localStorage.setItem('mc_admin_products', JSON.stringify(data.products));
              setSourceInfo('Đồng bộ từ Storefront API 🟢');
              setLoading(false);
              return;
            }
          }
        } catch (err) {
          console.warn("Could not fetch remote products, fallback to default", err);
        }

        // 3. Fallback danh sách mặc định
        setProducts(DEFAULT_PRODUCTS);
        localStorage.setItem('mc_admin_products', JSON.stringify(DEFAULT_PRODUCTS));
        setSourceInfo('Dữ liệu Cửa hàng Mèo Cưng chuẩn');
        setLoading(false);
      };

      useEffect(() => {
        loadProducts();
      }, []);

      // Lưu lại danh sách vào LocalStorage & gửi lên Storefront API
      const saveProductList = async (updatedList) => {
        setProducts(updatedList);
        localStorage.setItem('mc_admin_products', JSON.stringify(updatedList));

        // Bắn broadcast sync cho các tab khác hoặc trang storefront cùng domain
        try {
          window.dispatchEvent(new Event('storage'));
        } catch (_) {}
      };

      // Mở modal Thêm mới
      const handleOpenCreate = () => {
        setEditingProduct(null);
        setFormData({
          name: '',
          category: 'thuc-an-hat',
          price: 150000,
          originalPrice: 180000,
          weight: '1kg',
          image: 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
          description: '',
          inStock: true
        });
        setIsModalOpen(true);
      };

      // Mở modal Chỉnh sửa
      const handleOpenEdit = (p) => {
        setEditingProduct(p);
        setFormData({
          name: p.name || p.title || '',
          category: p.categorySlug || p.category || 'thuc-an-hat',
          price: p.price || 100000,
          originalPrice: p.originalPrice || Math.round((p.price || 100000) * 1.2),
          weight: p.weight || '1kg',
          image: p.image || p.thumbnail || 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
          description: p.description || '',
          inStock: p.inStock !== false
        });
        setIsModalOpen(true);
      };

      // Xử lý Xóa sản phẩm
      const handleDelete = async (id) => {
        if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi hệ thống?')) return;
        const updated = products.filter(p => p.id !== id);
        await saveProductList(updated);

        // Gọi API xóa Storefront nếu có mạng
        try {
          await fetch(`${STOREFRONT_URL}/api/medusa/products?id=${id}`, { method: 'DELETE' });
        } catch (_) {}
      };

      // Xử lý Lưu (Thêm mới hoặc Cập nhật)
      const handleSaveSubmit = async (e) => {
        e.preventDefault();
        if (!formData.name.trim()) {
          alert('Vui lòng nhập tên sản phẩm!');
          return;
        }

        const categoryNames = {
          'thuc-an-hat': 'Thức ăn hạt',
          'pate-cho-meo': 'Pate cho mèo',
          'cat-ve-sinh': 'Cát vệ sinh',
          'phu-kien': 'Phụ kiện & Đồ chơi'
        };

        if (editingProduct) {
          // Cập nhật
          const updated = products.map(p => {
            if (p.id === editingProduct.id) {
              return {
                ...p,
                name: formData.name,
                title: formData.name,
                category: formData.category,
                categorySlug: formData.category,
                categoryName: categoryNames[formData.category] || 'Sản phẩm',
                price: Number(formData.price),
                originalPrice: Number(formData.originalPrice),
                weight: formData.weight,
                image: formData.image,
                thumbnail: formData.image,
                description: formData.description,
                inStock: formData.inStock
              };
            }
            return p;
          });
          await saveProductList(updated);

          // Đồng bộ PUT lên Storefront API
          try {
            await fetch(`${STOREFRONT_URL}/api/medusa/products`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: editingProduct.id, ...formData })
            });
          } catch (_) {}
        } else {
          // Thêm mới
          const newId = `p_${Date.now()}`;
          const newProd = {
            id: newId,
            name: formData.name,
            title: formData.name,
            slug: `san-pham-${Date.now()}`,
            category: formData.category,
            categorySlug: formData.category,
            categoryName: categoryNames[formData.category] || 'Sản phẩm',
            price: Number(formData.price),
            originalPrice: Number(formData.originalPrice),
            weight: formData.weight,
            image: formData.image,
            thumbnail: formData.image,
            description: formData.description,
            inStock: formData.inStock,
            rating: 5.0,
            soldCount: 0
          };
          const updated = [newProd, ...products];
          await saveProductList(updated);

          // Đồng bộ POST lên Storefront API
          try {
            await fetch(`${STOREFRONT_URL}/api/medusa/products`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newProd)
            });
          } catch (_) {}
        }

        setIsModalOpen(false);
      };

      const filteredProducts = products.filter(p => {
        const title = (p.name || p.title || '').toLowerCase();
        return title.includes(searchQuery.toLowerCase());
      });

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-slate-50 font-sans">
          {/* SIDEBAR */}
          <aside className="w-64 border-r border-slate-200 bg-white flex flex-col justify-between shrink-0">
            <div>
              <div className="p-6 flex items-center gap-3 border-b border-slate-100">
                <div className="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center shadow-md shadow-orange-500/20 font-bold text-lg">
                  🐾
                </div>
                <div>
                  <h1 className="font-bold text-slate-800 text-lg leading-tight">Mèo Cưng</h1>
                  <p className="text-xs text-orange-600 font-semibold tracking-wide uppercase">Admin Dashboard</p>
                </div>
              </div>

              <nav className="p-4 space-y-1.5">
                <div className="px-3 py-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                  E-Commerce Catalog
                </div>
                <button
                  onClick={() => setActiveTab('products')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'products'
                      ? 'bg-orange-50 text-orange-700 font-semibold'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }`}
                >
                  <span className="text-base">📦</span>
                  Quản Lý Sản Phẩm
                  <span className="ml-auto text-xs bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded-full">
                    {products.length}
                  </span>
                </button>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'dashboard'
                      ? 'bg-orange-50 text-orange-700 font-semibold'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }`}
                >
                  <span className="text-base">📊</span>
                  Tổng Quan & Doanh Thu
                </button>

                <div className="pt-4 px-3 py-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                  Content Management (CMS)
                </div>
                <button
                  onClick={() => setActiveTab('payload')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    activeTab === 'payload'
                      ? 'bg-orange-50 text-orange-700 font-semibold'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                  }`}
                >
                  <span className="text-base">📝</span>
                  PayloadCMS (iFrame)
                  <span className="ml-auto text-[10px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded">
                    100 Bài
                  </span>
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-100 bg-slate-50/50">
              <div className="flex items-center justify-between text-xs mb-2">
                <span className="text-slate-500 font-medium">Trạng thái:</span>
                <span className="inline-flex items-center gap-1.5 text-emerald-600 font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  {sourceInfo}
                </span>
              </div>
              <a
                href={STOREFRONT_URL}
                target="_blank"
                rel="noreferrer"
                className="w-full flex items-center justify-center gap-2 py-2 px-3 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 shadow-sm"
              >
                <span>↗</span> Xem Storefront Mèo Cưng
              </a>
            </div>
          </aside>

          {/* MAIN VIEW */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* HEADER */}
            <header className="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3">
                <h2 className="text-xl font-bold text-slate-800">
                  {activeTab === 'products' && 'Quản Lý Danh Mục Sản Phẩm (Thêm - Xóa - Sửa)'}
                  {activeTab === 'dashboard' && 'Tổng Quan Hệ Thống E-Commerce'}
                  {activeTab === 'payload' && 'Quản Trị Nội Dung PayloadCMS 3.0'}
                </h2>
              </div>

              <div className="flex items-center gap-3">
                {activeTab === 'products' && (
                  <button
                    onClick={handleOpenCreate}
                    className="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm transition-colors"
                  >
                    <span>➕</span> Thêm Sản Phẩm Mới
                  </button>
                )}
                <button
                  onClick={loadProducts}
                  className="px-3 py-2 text-xs font-semibold text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-100 border border-slate-200 shadow-sm transition-colors"
                >
                  <span>🔄</span> {loading ? 'Đang tải...' : 'Đồng bộ'}
                </button>
              </div>
            </header>

            {/* TAB CONTENTS */}
            <div className="flex-1 overflow-auto bg-slate-50 p-6">
              {/* TAB 1: SẢN PHẨM (THÊM - XÓA - SỬA) */}
              {activeTab === 'products' && (
                <div className="space-y-4 max-w-7xl mx-auto">
                  {/* Thanh tìm kiếm và bộ lọc */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="relative flex-1 max-w-md">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="🔍 Tìm kiếm sản phẩm hạt, pate, cát..."
                        className="w-full px-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500"
                      />
                    </div>
                    <div className="text-xs text-slate-500 font-medium">
                      Hiển thị <strong>{filteredProducts.length}</strong> / <strong>{products.length}</strong> sản phẩm
                    </div>
                  </div>

                  {/* Bảng sản phẩm */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-slate-100 bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                            <th className="py-3.5 px-6">Ảnh & Tên Sản Phẩm</th>
                            <th className="py-3.5 px-6">Danh Mục</th>
                            <th className="py-3.5 px-6">Giá Bán</th>
                            <th className="py-3.5 px-6">Trọng Lượng</th>
                            <th className="py-3.5 px-6">Trạng Thái</th>
                            <th className="py-3.5 px-6 text-right">Thao Tác</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-sm">
                          {filteredProducts.map((p) => {
                            const name = p.name || p.title || 'Sản phẩm không tên';
                            const image = p.image || p.thumbnail || 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800';
                            const price = Number(p.price) || 0;
                            const cat = p.categoryName || p.categorySlug || p.category || 'Thức ăn mèo';

                            return (
                              <tr key={p.id} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-4 px-6 flex items-center gap-3.5">
                                  <div className="w-12 h-12 rounded-lg bg-orange-50 border border-orange-100 flex items-center justify-center overflow-hidden shrink-0">
                                    <img src={image} alt={name} className="w-full h-full object-cover" onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800'; }} />
                                  </div>
                                  <div className="min-w-0">
                                    <div className="font-semibold text-slate-800 line-clamp-1">{name}</div>
                                    <div className="text-xs text-slate-400 font-mono">ID: {p.id}</div>
                                  </div>
                                </td>
                                <td className="py-4 px-6">
                                  <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md font-medium">
                                    {cat}
                                  </span>
                                </td>
                                <td className="py-4 px-6">
                                  <span className="font-bold text-orange-600">
                                    {price.toLocaleString('vi-VN')} ₫
                                  </span>
                                  {p.originalPrice && (
                                    <div className="text-xs text-slate-400 line-through">
                                      {Number(p.originalPrice).toLocaleString('vi-VN')} ₫
                                    </div>
                                  )}
                                </td>
                                <td className="py-4 px-6 text-slate-600">
                                  {p.weight || '1kg'}
                                </td>
                                <td className="py-4 px-6">
                                  {p.inStock !== false ? (
                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Còn hàng
                                    </span>
                                  ) : (
                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">
                                      Hết hàng
                                    </span>
                                  )}
                                </td>
                                <td className="py-4 px-6 text-right space-x-2">
                                  <button
                                    onClick={() => handleOpenEdit(p)}
                                    className="px-3 py-1.5 text-xs font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors"
                                  >
                                    ✏️ Sửa
                                  </button>
                                  <button
                                    onClick={() => handleDelete(p.id)}
                                    className="px-3 py-1.5 text-xs font-semibold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 rounded-lg transition-colors"
                                  >
                                    🗑️ Xóa
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                          {filteredProducts.length === 0 && (
                            <tr>
                              <td colSpan="6" className="py-12 text-center text-slate-400">
                                Không tìm thấy sản phẩm nào phù hợp. Bấm "Thêm Sản Phẩm Mới" để thêm!
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: TỔNG QUAN */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Sản Phẩm Trong Kho
                        <span className="text-base">📦</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">{products.length}</div>
                      <p className="text-xs text-emerald-600 mt-1">Đã liên kết Storefront & Payload</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Bài Cẩm Nang Nuôi Mèo
                        <span className="text-base">📝</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">100+</div>
                      <p className="text-xs text-blue-600 mt-1">Quản lý trên PayloadCMS</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Liên Kết Storefront
                        <span className="text-base">🔗</span>
                      </div>
                      <div className="text-2xl font-bold text-emerald-600 mt-2">Hoạt động</div>
                      <p className="text-xs text-slate-400 mt-1">Realtime 2 chiều</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="flex items-center justify-between text-slate-500 text-xs font-medium uppercase tracking-wider">
                        Cơ Sở Dữ Liệu
                        <span className="text-base">🐘</span>
                      </div>
                      <div className="text-2xl font-bold text-slate-800 mt-2">PostgreSQL</div>
                      <p className="text-xs text-purple-600 mt-1">Neon Cloud High Speed</p>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 3: PAYLOADCMS IFRAME */}
              {activeTab === 'payload' && (
                <div className="w-full h-[calc(100vh-120px)] bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                  <div className="p-3 bg-slate-100/70 border-b border-slate-200 flex items-center justify-between text-xs px-4">
                    <div className="flex items-center gap-2 text-slate-600 font-medium">
                      <span>📝</span>
                      Giao diện <strong>PayloadCMS 3.0</strong> (Quản lý 100 bài viết cẩm nang & Banners)
                    </div>
                    <a
                      href={PAYLOAD_ADMIN_URL}
                      target="_blank"
                      rel="noreferrer"
                      className="text-orange-600 hover:text-orange-700 font-semibold"
                    >
                      Mở trang quản trị gốc ↗
                    </a>
                  </div>
                  <iframe
                    src={PAYLOAD_ADMIN_URL}
                    className="w-full flex-1 border-0"
                    title="PayloadCMS Admin"
                  />
                </div>
              )}
            </div>
          </main>

          {/* MODAL THÊM / SỬA SẢN PHẨM */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-100 overflow-hidden animate-in fade-in duration-200">
                <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="font-bold text-lg text-slate-800">
                    {editingProduct ? '✏️ Chỉnh Sửa Sản Phẩm' : '➕ Thêm Sản Phẩm Mới'}
                  </h3>
                  <button
                    onClick={() => setIsModalOpen(false)}
                    className="text-slate-400 hover:text-slate-600 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveSubmit} className="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Tên sản phẩm *</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder="VD: Hạt Royal Canin Indoor 2kg"
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Danh mục</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none bg-white"
                      >
                        <option value="thuc-an-hat">Thức ăn hạt</option>
                        <option value="pate-cho-meo">Pate cho mèo</option>
                        <option value="cat-ve-sinh">Cát vệ sinh</option>
                        <option value="phu-kien">Phụ kiện & Đồ chơi</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Trọng lượng</label>
                      <input
                        type="text"
                        value={formData.weight}
                        onChange={(e) => setFormData({ ...formData, weight: e.target.value })}
                        placeholder="VD: 2kg, 85g, 6L"
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Giá bán (VNĐ) *</label>
                      <input
                        type="number"
                        required
                        value={formData.price}
                        onChange={(e) => setFormData({ ...formData, price: e.target.value })}
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none font-semibold text-orange-600"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Giá gốc gạch ngang</label>
                      <input
                        type="number"
                        value={formData.originalPrice}
                        onChange={(e) => setFormData({ ...formData, originalPrice: e.target.value })}
                        className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Đường dẫn ảnh sản phẩm (URL)</label>
                    <input
                      type="url"
                      value={formData.image}
                      onChange={(e) => setFormData({ ...formData, image: e.target.value })}
                      placeholder="https://..."
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Mô tả sản phẩm</label>
                    <textarea
                      rows="3"
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      placeholder="Nhập thông tin dinh dưỡng, công dụng..."
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none"
                    ></textarea>
                  </div>

                  <div className="flex items-center gap-2 pt-2">
                    <input
                      type="checkbox"
                      id="inStock"
                      checked={formData.inStock}
                      onChange={(e) => setFormData({ ...formData, inStock: e.target.checked })}
                      className="w-4 h-4 text-orange-500 rounded border-slate-300 focus:ring-orange-500"
                    />
                    <label htmlFor="inStock" className="text-sm text-slate-700 font-medium">Sản phẩm còn hàng trong kho</label>
                  </div>

                  <div className="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
                    >
                      Hủy bỏ
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-sm font-semibold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm transition-colors"
                    >
                      Lưu Thay Đổi
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
