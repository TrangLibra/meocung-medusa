      const formatVndInput = (val) => {
        const num = Number(String(val ?? '').replace(/\D/g, ''));
        return num ? num.toLocaleString('vi-VN') : '';
      };
      const parseVndInput = (str) => {
        const digits = String(str ?? '').replace(/\D/g, '');
        return digits ? Number(digits) : 0;
      };
      function SingleUnifiedDashboard() {
        const [activeTab, setActiveTab] = useState('products');
        
        // Khởi tạo sản phẩm từ localStorage để đồng bộ thời gian thực với Storefront và các tab
        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('meocung_custom_products');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch (e) {}
          return INITIAL_PRODUCTS;
        });
        const [searchQuery, setSearchQuery] = useState('');

        // Tự động lưu và phát broadcast event khi có thay đổi sản phẩm
        useEffect(() => {
          try {
            localStorage.setItem('meocung_custom_products', JSON.stringify(products));
            window.dispatchEvent(new Event('products_updated'));
          } catch (e) {}
        }, [products]);

        // Dữ liệu PayloadCMS nạp trực tiếp qua Native REST API (Hoàn toàn không dùng iFrame, KHÔNG CẦN LOGIN)
        const [posts, setPosts] = useState(INITIAL_POSTS);
        const [postsLoading, setPostsLoading] = useState(false);
        const [postSearch, setPostSearch] = useState('');

        // Quản lý tài khoản khách hàng (lưu trực tiếp trên Neon PostgreSQL)
        const [customers, setCustomers] = useState([]);
        const [customersLoading, setCustomersLoading] = useState(false);
        const [customerError, setCustomerError] = useState('');
        const [customerSearch, setCustomerSearch] = useState('');
        const [customerStatusFilter, setCustomerStatusFilter] = useState('all');
        const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
        const [editingCustomer, setEditingCustomer] = useState(null);
        const [customerForm, setCustomerForm] = useState({ name: '', email: '', phone: '', password: '', status: 'active' });
        const [customerApiBase, setCustomerApiBase] = useState(
          window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api/admin/customers'
            : `${STOREFRONT_URL}/api/admin/customers`
        );

        const fetchCustomers = async (overrideSearch, overrideStatus) => {
          setCustomersLoading(true);
          setCustomerError('');
          const qVal = overrideSearch !== undefined ? overrideSearch : customerSearch;
          const stVal = overrideStatus !== undefined ? overrideStatus : customerStatusFilter;
          const params = new URLSearchParams();
          if (qVal.trim()) params.set('q', qVal.trim());
          if (stVal !== 'all') params.set('status', stVal);
          const qs = params.toString() ? `?${params.toString()}` : '';

          const candidates = window.location.hostname === 'localhost'
            ? ['http://localhost:3000/api/admin/customers', 'https://meocung-ecommerce-atoan.vercel.app/api/admin/customers', `${STOREFRONT_URL}/api/admin/customers`]
            : ['https://meocung-ecommerce-atoan.vercel.app/api/admin/customers', `${STOREFRONT_URL}/api/admin/customers`];

          for (const base of candidates) {
            try {
              const res = await fetch(`${base}${qs}`);
              if (res.ok) {
                const data = await res.json();
                setCustomers(data.users || []);
                setCustomerApiBase(base);
                setCustomersLoading(false);
                return;
              }
            } catch (_) {}
          }
          setCustomerError('Chưa kết nối được API Neon (/api/admin/customers). Hãy chạy meocung-ecommerce-main ở cổng 3000 hoặc deploy lên Vercel.');
          setCustomersLoading(false);
        };

        useEffect(() => {
          if (activeTab === 'customers') {
            fetchCustomers();
          }
        }, [activeTab, customerStatusFilter]);

        const handleOpenCreateCustomer = () => {
          setEditingCustomer(null);
          setCustomerForm({ name: '', email: '', phone: '', password: '', status: 'active' });
          setIsCustomerModalOpen(true);
        };

        const handleOpenEditCustomer = (c) => {
          setEditingCustomer(c);
          setCustomerForm({ name: c.name || '', email: c.email || '', phone: c.phone || '', password: '', status: c.status || 'active' });
          setIsCustomerModalOpen(true);
        };

        const handleSaveCustomer = async (e) => {
          e.preventDefault();
          try {
            const url = editingCustomer ? `${customerApiBase}/${editingCustomer.id}` : customerApiBase;
            const method = editingCustomer ? 'PATCH' : 'POST';
            const payload = {
              name: customerForm.name,
              email: customerForm.email,
              phone: customerForm.phone,
              status: customerForm.status,
            };
            if (customerForm.password) payload.password = customerForm.password;
            const res = await fetch(url, {
              method,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.error || 'Không thể lưu tài khoản!');
            setIsCustomerModalOpen(false);
            fetchCustomers();
          } catch (_e) {
            alert('Lỗi kết nối tới API Neon!');
          }
        };

        const handleToggleCustomerStatus = async (c) => {
          const nextStatus = c.status === 'active' ? 'blocked' : 'active';
          try {
            const res = await fetch(`${customerApiBase}/${c.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: nextStatus }),
            });
            if (res.ok) fetchCustomers();
          } catch (_e) {}
        };

        const handleDeleteCustomer = async (c) => {
          if (!confirm(`Xóa vĩnh viễn tài khoản ${c.email} khỏi Neon PostgreSQL?`)) return;
          try {
            const res = await fetch(`${customerApiBase}/${c.id}`, { method: 'DELETE' });
            if (res.ok) fetchCustomers();
          } catch (_e) {}
        };

        // Quản lý đơn hàng & vận chuyển (lưu trực tiếp trên Neon PostgreSQL)
        const INITIAL_ORDERS = [
          { id: 'ORD-9821', customer_name: 'Nguyễn Văn An', phone: '0912 345 678', product_name: 'Hạt Royal Canin Fit 32 (2kg)', total_amount: 185000, status: 'completed' },

          { id: 'ORD-9823', customer_name: 'Lê Hoàng Nam', phone: '0905 112 334', product_name: 'Cát Đậu Nành Cature Tofu Clumping 6L', total_amount: 125000, status: 'packing' },
          { id: 'ORD-9824', customer_name: 'Phạm Quỳnh Nga', phone: '0973 889 900', product_name: 'Hạt Catsrang Cho Mèo Mọi Lứa Tuổi (5kg)', total_amount: 340000, status: 'pending' }
        ];
        const [orders, setOrders] = useState(INITIAL_ORDERS);
        const [ordersLoading, setOrdersLoading] = useState(false);
        const [orderError, setOrderError] = useState('');
        const [orderSearch, setOrderSearch] = useState('');
        const [orderStatusFilter, setOrderStatusFilter] = useState('all');
        const [orderApiBase, setOrderApiBase] = useState(
          window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api/admin/orders'
            : `${STOREFRONT_URL}/api/admin/orders`
        );

        const ORDER_STATUS_LABELS = {
          pending: { label: 'Chờ xác nhận', cls: 'bg-amber-950 text-amber-400 border-amber-800/50' },
          confirmed: { label: 'Đã xác nhận', cls: 'bg-indigo-950 text-indigo-400 border-indigo-800/50' },
          shipping: { label: 'Đang vận chuyển', cls: 'bg-blue-950 text-blue-400 border-blue-800/50' },
          delivered: { label: 'Đã giao hàng', cls: 'bg-emerald-950 text-emerald-400 border-emerald-800/50' },
          cancelled: { label: 'Đã hủy', cls: 'bg-rose-950 text-rose-400 border-rose-800/50' },
        };

        const fetchOrders = async (overrideSearch, overrideStatus) => {
          setOrdersLoading(true);
          setOrderError('');
          const qVal = overrideSearch !== undefined ? overrideSearch : orderSearch;
          const stVal = overrideStatus !== undefined ? overrideStatus : orderStatusFilter;
          const params = new URLSearchParams();
          if (qVal.trim()) params.set('q', qVal.trim());
          if (stVal !== 'all') params.set('status', stVal);
          const qs = params.toString() ? `?${params.toString()}` : '';

          const candidates = window.location.hostname === 'localhost'
            ? ['http://localhost:3000/api/admin/orders', 'https://meocung-ecommerce-atoan.vercel.app/api/admin/orders', `${STOREFRONT_URL}/api/admin/orders`]
            : ['https://meocung-ecommerce-atoan.vercel.app/api/admin/orders', `${STOREFRONT_URL}/api/admin/orders`];

          for (const base of candidates) {
            try {
              const res = await fetch(`${base}${qs}`);
              if (res.ok) {
                const data = await res.json();
                setOrders(data.orders || []);
                setOrderApiBase(base);
                setOrdersLoading(false);
                return;
              }
            } catch (_) {}
          }
          setOrderError('Chưa kết nối được API đơn hàng Neon (/api/admin/orders).');
          setOrdersLoading(false);
        };

        useEffect(() => {
          fetchOrders();
          fetchCustomers();
        }, []);

        useEffect(() => {
          if (activeTab === 'orders') {
            fetchOrders();
          }
        }, [activeTab, orderStatusFilter]);

        const handleUpdateOrderStatus = async (order, nextStatus) => {
          try {
            const res = await fetch(`${orderApiBase}/${order.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: nextStatus }),
            });
            if (res.ok) fetchOrders();
          } catch (_e) {}
        };

        const handleUpdateTracking = async (order) => {
          const code = prompt(`Nhập mã vận đơn cho đơn #${order.order_code}:`, order.tracking_code || '');
          if (code === null) return;
          try {
            const res = await fetch(`${orderApiBase}/${order.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tracking_code: code.trim() }),
            });
            if (res.ok) fetchOrders();
          } catch (_e) {}
        };

        const handleDeleteOrder = async (order) => {
          if (!confirm(`Xóa đơn hàng #${order.order_code} khỏi Neon PostgreSQL?`)) return;
          try {
            const res = await fetch(`${orderApiBase}/${order.id}`, { method: 'DELETE' });
            if (res.ok) fetchOrders();

                          const tmp = copy[cIdx];
                          copy[cIdx] = copy[targetIdx];

                          setSiteSettings({

                            pages_config: {
                              ...siteSettings.pages_config,
                              footer: { ...siteSettings.pages_config?.footer, columns: copy }

                          });

                            ...siteSettings,
                            pages_config: {
                              ...siteSettings.pages_config,
                              footer: { ...siteSettings.pages_config?.footer, columns: copy }

                            pages_config: {
                              ...siteSettings.pages_config,

                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Mật khẩu mặc định</label>
                      <input type="password" value={staffForm.password} onChange={(e) => setStaffForm({ ...staffForm, password: e.target.value })} placeholder="Mặc định: Admin@123" className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Vai Trò Phân Quyền</label>
                      <select value={staffForm.role} onChange={(e) => setStaffForm({ ...staffForm, role: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100">
                        <option value="admin">Super Admin (Toàn quyền)</option>
                        <option value="warehouse_manager">Quản Lý Kho & Sản Phẩm</option>
                        <option value="editor">Biên Tập Viên (PayloadCMS)</option>
                        <option value="order_staff">Nhân Viên Xử Lý Đơn</option>
                      </select>
                    </div>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsStaffModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg">Tạo Nhân Viên</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL TẠO VAI TRÒ RBAC */}
            {isRoleModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-md w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">Tạo Vai Trò Phân Quyền Mới</h3>
                    <button onClick={() => setIsRoleModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>
                  <form onSubmit={handleCreateRole} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Tên Vai Trò *</label>
                      <input type="text" required value={roleForm.name} onChange={(e) => setRoleForm({ ...roleForm, name: e.target.value })} placeholder="VD: Cộng tác viên kho" className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Mã Vai Trò (Code)</label>
                      <input type="text" value={roleForm.code} onChange={(e) => setRoleForm({ ...roleForm, code: e.target.value })} placeholder="VD: ctv_kho" className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-300 font-mono" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Mô tả nhiệm vụ</label>
                      <textarea rows={2} value={roleForm.description} onChange={(e) => setRoleForm({ ...roleForm, description: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                    </div>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsRoleModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg">Lưu Vai Trò</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL DANH MỤC */}
            {isCatModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-md w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">{editingCat ? 'Sửa Danh Mục' : 'Thêm Danh Mục Mới'}</h3>
                    <button onClick={() => setIsCatModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>
                  <form onSubmit={handleSaveCategory} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Tên Danh Mục *</label>
                      <input type="text" required value={catForm.name} onChange={(e) => setCatForm({ ...catForm, name: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Đường dẫn (Handle)</label>
                      <input type="text" value={catForm.handle} onChange={(e) => setCatForm({ ...catForm, handle: e.target.value })} placeholder="VD: thuc-an-hat (tự tạo nếu để trống)" className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-300 font-mono" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Mô tả</label>
                      <textarea rows={2} value={catForm.description} onChange={(e) => setCatForm({ ...catForm, description: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                    </div>
                    <label className="flex items-center gap-2 text-slate-300 font-semibold">
                      <input type="checkbox" checked={catForm.is_active} onChange={(e) => setCatForm({ ...catForm, is_active: e.target.checked })} />
                      <span>Kích hoạt danh mục</span>
                    </label>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsCatModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg">Lưu Danh Mục</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL BỘ SƯU TẬP */}
            {isColModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-md w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">{editingCol ? 'Sửa Bộ Sưu Tập' : 'Tạo Bộ Sưu Tập Mới'}</h3>
                    <button onClick={() => setIsColModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>
                  <form onSubmit={handleSaveCollection} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Tên Bộ Sưu Tập *</label>
                      <input type="text" required value={colForm.title} onChange={(e) => setColForm({ ...colForm, title: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Đường dẫn (Handle)</label>
                      <input type="text" value={colForm.handle} onChange={(e) => setColForm({ ...colForm, handle: e.target.value })} placeholder="VD: ban-chay" className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-300 font-mono" />
                    </div>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsColModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg">Lưu Bộ Sưu Tập</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL BANNER */}
            {isBannerModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-lg w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">{editingBanner ? 'Sửa Banner' : 'Thêm Banner Mới'}</h3>
                    <button onClick={() => setIsBannerModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>
                  <form onSubmit={handleSaveBanner} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Tiêu đề Banner *</label>
                      <input type="text" required value={bannerForm.title} onChange={(e) => setBannerForm({ ...bannerForm, title: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Ảnh Banner (Vercel Blob)</label>
                      <div className="flex items-center gap-2">
                        <input type="url" required value={bannerForm.image_url} onChange={(e) => setBannerForm({ ...bannerForm, image_url: e.target.value })} className="flex-1 bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                        <label className="cursor-pointer shrink-0 px-3 py-2 bg-[#27272a] hover:bg-[#323238] border border-[#3f3f46] rounded-lg font-bold text-slate-200">
                          {uploadingTarget === 'banner' ? '⏳ Đang tải...' : '📁 Chọn ảnh từ máy'}
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (f) handleUploadImage(f, 'banner'); e.target.value = ''; }} />
                        </label>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Đường dẫn khi bấm vào</label>
                        <input type="text" value={bannerForm.link_url} onChange={(e) => setBannerForm({ ...bannerForm, link_url: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Vị trí</label>
                        <select value={bannerForm.position} onChange={(e) => setBannerForm({ ...bannerForm, position: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100">
                          <option value="home_slider">Slider đầu trang chủ</option>
                          <option value="mid_banner">Banner giữa trang</option>
                        </select>
                      </div>
                    </div>
                    <label className="flex items-center gap-2 text-slate-300 font-semibold">
                      <input type="checkbox" checked={bannerForm.is_active} onChange={(e) => setBannerForm({ ...bannerForm, is_active: e.target.checked })} />
                      <span>Hiển thị trên Website</span>
                    </label>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsBannerModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg">Lưu Banner</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL COUPON */}
            {isCouponModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-md w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">{editingCoupon ? 'Sửa Mã Giảm Giá' : 'Tạo Mã Giảm Giá Mới'}</h3>
                    <button onClick={() => setIsCouponModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>
                  <form onSubmit={handleSaveCoupon} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Mã Voucher *</label>
                      <input type="text" required value={couponForm.code} onChange={(e) => setCouponForm({ ...couponForm, code: e.target.value.toUpperCase() })} placeholder="VD: MEOCUNG20" className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 font-mono uppercase" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Giảm (%)</label>
                        <input type="number" required min="1" max="100" value={couponForm.discount_percent} onChange={(e) => setCouponForm({ ...couponForm, discount_percent: Number(e.target.value) })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Đơn tối thiểu (VNĐ)</label>
                        <input type="number" required value={couponForm.min_order_value} onChange={(e) => setCouponForm({ ...couponForm, min_order_value: Number(e.target.value) })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                      </div>
                    </div>
                    <label className="flex items-center gap-2 text-slate-300 font-semibold">
                      <input type="checkbox" checked={couponForm.is_active} onChange={(e) => setCouponForm({ ...couponForm, is_active: e.target.checked })} />
                      <span>Kích hoạt mã</span>
                    </label>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsCouponModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg">Lưu Mã</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<SingleUnifiedDashboard />);
    </script>
</body>
</html>
