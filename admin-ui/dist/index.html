      const formatVndInput = (val) => {
        const num = Number(String(val ?? '').replace(/\D/g, ''));
        return num ? num.toLocaleString('vi-VN') : '';
      };
      const parseVndInput = (str) => {
        const digits = String(str ?? '').replace(/\D/g, '');
        return digits ? Number(digits) : 0;
      };
      function SingleUnifiedDashboard() {
        const [activeTab, setActiveTab] = useState('products');
        
        // Khởi tạo sản phẩm từ localStorage để đồng bộ thời gian thực với Storefront và các tab
        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('meocung_custom_products');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch (e) {}
          return INITIAL_PRODUCTS;
        });
        const [searchQuery, setSearchQuery] = useState('');

        // NHÓM 1 (SALEOR UX): Command Bar (Ctrl+K) & Bulk Actions
        const [isCommandOpen, setIsCommandOpen] = useState(false);
        const [commandQuery, setCommandQuery] = useState('');
        const [selectedProductIds, setSelectedProductIds] = useState([]);
        const [bulkStockValue, setBulkStockValue] = useState('');
        const [bulkPricePercent, setBulkPricePercent] = useState('');
        const [selectedOrderIds, setSelectedOrderIds] = useState([]);
        const [bulkOrderStatus, setBulkOrderStatus] = useState('confirmed');

        useEffect(() => {
          const onKeyDown = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
              e.preventDefault();
              setIsCommandOpen((prev) => !prev);
            } else if (e.key === 'Escape') {
              setIsCommandOpen(false);
            }
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, []);

        const exportToCsv = (filename, headers, rows) => {
          const escapeCell = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
          const csv = [headers.map(escapeCell).join(','), ...rows.map((r) => r.map(escapeCell).join(','))].join('\n');
          const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
        };

        const handleBulkProductStock = async () => {
          const qty = Number(bulkStockValue);
          if (Number.isNaN(qty) || qty < 0 || selectedProductIds.length === 0) return;
          const targets = products.filter((p) => selectedProductIds.includes(p.id));
          await Promise.all(targets.map((p) => handleQuickUpdateProductField(p, { inventory: qty })));
          setBulkStockValue('');
          setSelectedProductIds([]);
        };

        const handleBulkProductPricePercent = async () => {
          const pct = Number(bulkPricePercent);
          if (Number.isNaN(pct) || pct === 0 || selectedProductIds.length === 0) return;
          const targets = products.filter((p) => selectedProductIds.includes(p.id));
          await Promise.all(targets.map((p) => {
            const nextPrice = Math.max(1000, Math.round((Number(p.price || 0) * (1 + pct / 100)) / 1000) * 1000);
            return handleQuickUpdateProductField(p, { price: nextPrice });
          }));
          setBulkPricePercent('');
          setSelectedProductIds([]);
        };

        const handleBulkDeleteProducts = async () => {
          if (selectedProductIds.length === 0) return;
          if (!(await window.catConfirm(`Xác nhận xóa ${selectedProductIds.length} sản phẩm đã chọn khỏi kho hàng?`))) return;
          await Promise.all(selectedProductIds.map((id) =>
            fetch(`${getCmsApiCandidates('/api/medusa/products')[0]}?id=${id}`, { method: 'DELETE' }).catch(() => {})
          ));
          setProducts((prev) => prev.filter((p) => !selectedProductIds.includes(p.id)));
          setSelectedProductIds([]);
        };

        const handleBulkUpdateOrders = async () => {
          if (selectedOrderIds.length === 0) return;
          await Promise.all(selectedOrderIds.map((id) =>
            fetch(`${orderApiBase}/${id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: bulkOrderStatus }),
            }).catch(() => {})
          ));
          setSelectedOrderIds([]);
          fetchOrders();
        };

        // Tự động lưu và phát broadcast event khi có thay đổi sản phẩm
        useEffect(() => {
          try {
            localStorage.setItem('meocung_custom_products', JSON.stringify(products));
            window.dispatchEvent(new Event('products_updated'));
          } catch (e) {}
        }, [products]);

        // Dữ liệu PayloadCMS nạp trực tiếp qua Native REST API (Hoàn toàn không dùng iFrame, KHÔNG CẦN LOGIN)
        const [posts, setPosts] = useState(INITIAL_POSTS);
        const [postsLoading, setPostsLoading] = useState(false);
        const [postSearch, setPostSearch] = useState('');

        // Quản lý tài khoản khách hàng (lưu trực tiếp PostgreSQL)
        const [customers, setCustomers] = useState([]);
        const [customersLoading, setCustomersLoading] = useState(false);
        const [customerError, setCustomerError] = useState('');
        const [customerSearch, setCustomerSearch] = useState('');
        const [customerStatusFilter, setCustomerStatusFilter] = useState('all');
        const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
        const [editingCustomer, setEditingCustomer] = useState(null);
        const [customerForm, setCustomerForm] = useState({ name: '', email: '', phone: '', password: '', status: 'active' });
        const [customerApiBase, setCustomerApiBase] = useState(
          window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api/admin/customers'
            : `${STOREFRONT_URL}/api/admin/customers`
        );

        const fetchCustomers = async (overrideSearch, overrideStatus) => {
          setCustomersLoading(true);
          setCustomerError('');
          const qVal = overrideSearch !== undefined ? overrideSearch : customerSearch;
          const stVal = overrideStatus !== undefined ? overrideStatus : customerStatusFilter;
          const params = new URLSearchParams();
          if (qVal.trim()) params.set('q', qVal.trim());
          if (stVal !== 'all') params.set('status', stVal);
          const qs = params.toString() ? `?${params.toString()}` : '';

          const candidates = window.location.hostname === 'localhost'
            ? ['http://localhost:3000/api/admin/customers', 'https://meocung-ecommerce-atoan.vercel.app/api/admin/customers', `${STOREFRONT_URL}/api/admin/customers`]
            : ['https://meocung-ecommerce-atoan.vercel.app/api/admin/customers', `${STOREFRONT_URL}/api/admin/customers`];

          for (const base of candidates) {
            try {
              const res = await fetch(`${base}${qs}`);
              if (res.ok) {
                const data = await res.json();
                setCustomers(data.users || []);
                setCustomerApiBase(base);
                setCustomersLoading(false);
                return;
              }
            } catch (_) {}
          }
          setCustomerError('Chưa kết nối được API (/api/admin/customers). Hãy chạy meocung-ecommerce-main ở cổng 3000 hoặc deploy lên Vercel.');
          setCustomersLoading(false);
        };

        useEffect(() => {
          if (activeTab === 'customers') {
            fetchCustomers();
          }
        }, [activeTab, customerStatusFilter]);

        const handleOpenCreateCustomer = () => {
          setEditingCustomer(null);
          setCustomerForm({ name: '', email: '', phone: '', password: '', status: 'active' });
          setIsCustomerModalOpen(true);
        };

        const handleOpenEditCustomer = (c) => {
          setEditingCustomer(c);
          setCustomerForm({ name: c.name || '', email: c.email || '', phone: c.phone || '', password: '', status: c.status || 'active' });
          setIsCustomerModalOpen(true);
        };

        const handleSaveCustomer = async (e) => {
          e.preventDefault();
          try {
            const url = editingCustomer ? `${customerApiBase}/${editingCustomer.id}` : customerApiBase;
            const method = editingCustomer ? 'PATCH' : 'POST';
            const payload = {
              name: customerForm.name,
              email: customerForm.email,
              phone: customerForm.phone,
              status: customerForm.status,
            };
            if (customerForm.password) payload.password = customerForm.password;
            const res = await fetch(url, {
              method,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.error || 'Không thể lưu tài khoản!');
            setIsCustomerModalOpen(false);
            fetchCustomers();
          } catch (_e) {
            alert('Lỗi kết nối tới API!');
          }
        };

          const nextStatus = c.status === 'active' ? 'blocked' : 'active';
          try {
            const res = await fetch(`${customerApiBase}/${c.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: nextStatus }),
            });
            if (res.ok) fetchCustomers();
          } catch (_e) {}
        };

        const handleDeleteCustomer = async (c) => {
          if (!(await window.catConfirm(`Xóa vĩnh viễn tài khoản ${c.email}?`))) return;
          try {
            const res = await fetch(`${customerApiBase}/${c.id}`, { method: 'DELETE' });

        // Quản lý đơn hàng & vận chuyển (lưu trực tiếp PostgreSQL)
        const INITIAL_ORDERS = [

            const curVariants = Array.isArray(prev.variants) ? prev.variants : [];
            const nextVariants = exists
              ? curVariants.filter((v) => String(v.title || '').trim().toUpperCase() !== `SIZE ${size}`)
              : [...curVariants, { title: `Size ${size}`, sku: `SZ-${size}`, price: Number(prev.price || 150000), inventory: Number(prev.inventory || 50) }];
            return { ...prev, sizes: nextSizes, variants: nextVariants };
          });

            reader.onload = () => {
              const img = new Image();
              img.onload = () => {
                const maxSide = 700;
                let w = img.width;
                let h = img.height;
                if (w > maxSide || h > maxSide) {
                  if (w >= h) { h = Math.round((h * maxSide) / w); w = maxSide; }
                  else { w = Math.round((w * maxSide) / h); h = maxSide; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                setProductForm((prev) => {
                  const nextImages = [...(Array.isArray(prev.images) ? prev.images : (prev.image ? [prev.image] : [])), dataUrl];
                  return { ...prev, images: nextImages, image: prev.image || nextImages[0] || '' };

              img.src = reader.result;

                        <label className="block font-bold text-slate-300 mb-1">Đường dẫn khi bấm vào</label>
                        <input type="text" value={bannerForm.link_url} onChange={(e) => setBannerForm({ ...bannerForm, link_url: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Vị trí</label>
                        <select value={bannerForm.position} onChange={(e) => setBannerForm({ ...bannerForm, position: e.target.value })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100">
                          <option value="home_slider">Slider đầu trang chủ</option>
                          <option value="mid_banner">Banner giữa trang</option>
                        </select>
                      </div>
                    </div>
                    <label className="flex items-center gap-2 text-slate-300 font-semibold">
                      <input type="checkbox" checked={bannerForm.is_active} onChange={(e) => setBannerForm({ ...bannerForm, is_active: e.target.checked })} />
                      <span>Hiển thị trên Website</span>
                    </label>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsBannerModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg">Lưu Banner</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL COUPON */}
            {isCouponModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-md w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">{editingCoupon ? 'Sửa Mã Giảm Giá' : 'Tạo Mã Giảm Giá Mới'}</h3>
                    <button onClick={() => setIsCouponModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>
                  <form onSubmit={handleSaveCoupon} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Mã Voucher *</label>
                      <input type="text" required value={couponForm.code} onChange={(e) => setCouponForm({ ...couponForm, code: e.target.value.toUpperCase() })} placeholder="VD: MEOCUNG20" className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 font-mono uppercase" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Giảm (%)</label>
                        <input type="number" required min="1" max="100" value={couponForm.discount_percent} onChange={(e) => setCouponForm({ ...couponForm, discount_percent: Number(e.target.value) })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-300 mb-1">Đơn tối thiểu (VNĐ)</label>
                        <input type="number" required value={couponForm.min_order_value} onChange={(e) => setCouponForm({ ...couponForm, min_order_value: Number(e.target.value) })} className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100" />
                      </div>
                    </div>
                    <label className="flex items-center gap-2 text-slate-300 font-semibold">
                      <input type="checkbox" checked={couponForm.is_active} onChange={(e) => setCouponForm({ ...couponForm, is_active: e.target.checked })} />
                      <span>Kích hoạt mã</span>
                    </label>
                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button type="button" onClick={() => setIsCouponModalOpen(false)} className="px-3.5 py-2 font-bold text-slate-400 bg-[#27272a] rounded-lg">Hủy</button>
                      <button type="submit" className="px-4 py-2 font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg">Lưu Mã</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* DOCKED IDE-STYLE AI SIDE PANEL (KÉO GIÃN KÍCH THƯỚC ĐƯỢC) */}
            <AdminAiCopilot />
          </div>
        );
      }

      function AdminAiCopilot() {
        const [open, setOpen] = useState(false);
        const [panelWidth, setPanelWidth] = useState(400);
        const [isResizing, setIsResizing] = useState(false);
        const [input, setInput] = useState('');
        const [attachedImage, setAttachedImage] = useState('');
        const [excelFileName, setExcelFileName] = useState('');
        const [excelRows, setExcelRows] = useState([]);
        const [folderImages, setFolderImages] = useState({});
        const [attachMenuOpen, setAttachMenuOpen] = useState(false);
        const [loading, setLoading] = useState(false);
        const fileInputRef = useRef(null);
        const excelInputRef = useRef(null);
        const folderInputRef = useRef(null);

        useEffect(() => {
          if (!isResizing) return;
          const handleMouseMove = (e) => {
            const nextW = Math.min(760, Math.max(320, window.innerWidth - e.clientX));
            setPanelWidth(nextW);
          };
          const handleMouseUp = () => setIsResizing(false);
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
          document.body.style.userSelect = 'none';
          document.body.style.cursor = 'col-resize';
          return () => {
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('mouseup', handleMouseUp);
            document.body.style.userSelect = '';
            document.body.style.cursor = '';
          };
        }, [isResizing]);
        const [messages, setMessages] = useState([
          {
            role: 'ai',
            text: 'Chào Admin! Mình là Trợ lý AI Mèo Cưng. Bạn cần hỗ trợ gì cứ nhắn nhé (nhắn "bạn có thể làm gì" để xem các việc mình làm được).',
          },
        ]);

        useEffect(() => {
          const onToggle = () => setOpen((v) => !v);
          window.addEventListener('toggle-admin-ai', onToggle);
          return () => window.removeEventListener('toggle-admin-ai', onToggle);
        }, []);

        const handlePickImage = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxSide = 600;
              let w = img.width;
              let h = img.height;
              if (w > maxSide || h > maxSide) {
                if (w >= h) { h = Math.round((h * maxSide) / w); w = maxSide; }
                else { w = Math.round((w * maxSide) / h); h = maxSide; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              setAttachedImage(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        };

        const compressImageFile = (file) => new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxSide = 600;
              let w = img.width;
              let h = img.height;
              if (w > maxSide || h > maxSide) {
                if (w >= h) { h = Math.round((h * maxSide) / w); w = maxSide; }
                else { w = Math.round((w * maxSide) / h); h = maxSide; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = () => resolve('');
            img.src = reader.result;
          };
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });

        const handlePickExcel = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const wb = window.XLSX.read(ev.target.result, { type: 'array' });
              const firstSheet = wb.SheetNames[0];
              const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[firstSheet], { defval: '' });
              setExcelFileName(file.name);
              setExcelRows(rows);
            } catch (_err) {
              alert('Không đọc được file Excel. Vui lòng kiểm tra định dạng .xlsx / .xls / .csv');
            }
          };
          reader.readAsArrayBuffer(file);
          e.target.value = '';
        };

        const handlePickImageFolder = async (e) => {
          const files = Array.from(e.target.files || []).filter((f) => f.type.startsWith('image/'));
          if (!files.length) return;
          const map = {};
          for (const f of files.slice(0, 60)) {
            const dataUrl = await compressImageFile(f);
            if (dataUrl) {
              map[f.name.toLowerCase()] = dataUrl;
              const noExt = f.name.replace(/\.[^.]+$/, '').toLowerCase();
              map[noExt] = dataUrl;
            }
          }
          setFolderImages(map);
          e.target.value = '';
        };

        const sendMessage = async (textOverride) => {
          const msg = (textOverride !== undefined ? textOverride : input).trim() || (excelRows.length > 0 ? `Nhập ${excelRows.length} sản phẩm từ Excel` : '');
          if (!msg || loading) return;
          const imgToSend = attachedImage;
          const enrichedExcelRows = excelRows.map((row) => {
            const copy = { ...row };
            const imgKey = Object.keys(copy).find((k) => /^(ảnh|anh|hình|hinh|image|img|photo|thumbnail|url ảnh|link ảnh|file ảnh)/i.test(k.trim()));
            const rawImg = imgKey ? String(copy[imgKey] || '').trim() : '';
            if (rawImg && !rawImg.startsWith('http') && !rawImg.startsWith('data:')) {
              const base = rawImg.split(/[\\/]/).pop().toLowerCase();
              const noExt = base.replace(/\.[^.]+$/, '');
              if (folderImages[base]) copy.__matchedImage = folderImages[base];
              else if (folderImages[noExt]) copy.__matchedImage = folderImages[noExt];
            }
            if (!copy.__matchedImage) {
              const skuKey = Object.keys(copy).find((k) => /sku|ma|mã/i.test(k));
              const nameKey = Object.keys(copy).find((k) => /ten|tên|name|title/i.test(k));
              const skuVal = skuKey ? String(copy[skuKey] || '').trim().toLowerCase() : '';
              const nameVal = nameKey ? String(copy[nameKey] || '').trim().toLowerCase() : '';
              if (skuVal && folderImages[skuVal]) copy.__matchedImage = folderImages[skuVal];
              else if (nameVal && folderImages[nameVal]) copy.__matchedImage = folderImages[nameVal];
            }
            return copy;
          });

          setMessages((prev) => [
            ...prev,
            {
              role: 'user',
              text: `${msg}${excelRows.length ? `\n📊 File: ${excelFileName} (${excelRows.length} dòng)` : ''}${Object.keys(folderImages).length ? ` • 📁 Đã chọn thư mục ảnh` : ''}`,
              image: imgToSend || undefined,
            },
          ]);
          setInput('');
          setAttachedImage('');
          setExcelFileName('');
          setExcelRows([]);
          setLoading(true);

          const endpoints = window.location.hostname === 'localhost'
            ? ['http://localhost:3000/api/admin/ai-assistant', 'https://meocung-ecommerce-atoan.vercel.app/api/admin/ai-assistant']
            : ['https://meocung-ecommerce-atoan.vercel.app/api/admin/ai-assistant'];

          for (const url of endpoints) {
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  message: msg,
                  image: imgToSend || undefined,
                  excelRows: enrichedExcelRows.length ? enrichedExcelRows : undefined,
                }),
              });
              const data = await res.json().catch(() => ({}));
              if (res.ok) {
                setMessages((prev) => [...prev, { role: 'ai', text: data.reply || 'Đã hoàn tất!' }]);
                if (data.actionExecuted) {
                  window.dispatchEvent(new CustomEvent('admin-data-changed', { detail: { targets: data.refreshTargets || [] } }));
                }
                setLoading(false);
                return;
              } else {
                setMessages((prev) => [...prev, { role: 'ai', text: `⚠️ ${data.error || 'Lỗi xử lý AI'}` }]);
                setLoading(false);
                return;
              }
            } catch (_e) {}
          }
          setMessages((prev) => [...prev, { role: 'ai', text: '⚠️ Không kết nối được API Trợ lý AI.' }]);
          setLoading(false);
        };

        if (!open) return null;

        return (
          <aside
            style={{ width: `${panelWidth}px` }}
            className="h-screen max-w-[92vw] shrink-0 bg-[#18181b] border-l border-[#27272a] shadow-2xl flex relative z-30 overflow-hidden"
          >
            {/* Thanh kéo giãn kích thước giống Antigravity IDE */}
            <div
              onMouseDown={() => setIsResizing(true)}
              title="Kéo trái / phải để chỉnh độ rộng khung Trợ lý AI"
              className={`w-1.5 h-full cursor-col-resize shrink-0 transition-colors ${isResizing ? 'bg-orange-500' : 'bg-transparent hover:bg-orange-500/60'}`}
            />
            <div className="flex-1 min-w-0 flex flex-col overflow-hidden">
            <div className="h-14 px-4 border-b border-[#27272a] flex items-center justify-between shrink-0 bg-[#18181b]">
              <div className="flex items-center gap-2.5">
                <span className="w-7 h-7 rounded-lg bg-gradient-to-br from-orange-600 to-amber-500 text-white flex items-center justify-center text-sm shadow-sm">✨</span>
                <div>
                  <p className="text-xs font-extrabold text-slate-100">Trợ Lý AI Admin</p>
                  <p className="text-[10px] text-emerald-400">Hỗ trợ quản lý cửa hàng nhanh</p>
                </div>
              </div>
              <button
                type="button"
                onClick={() => setOpen(false)}
                title="Đóng Trợ Lý AI"
                className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-100 hover:bg-[#27272a] font-bold text-sm"
              >
                ✕
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
              {messages.map((m, i) => (
                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[88%] px-3.5 py-2.5 rounded-2xl whitespace-pre-line leading-relaxed ${
                    m.role === 'user'
                      ? 'bg-orange-600 text-white font-medium'
                      : 'bg-[#121214] border border-[#27272a] text-slate-200'
                  }`}>
                    {m.image && (
                      <img src={m.image} alt="Đính kèm" className="w-40 h-28 object-cover rounded-xl mb-2 border border-white/20" />
                    )}
                    {m.text}
                  </div>
                </div>
              ))}
              {loading && (
                <div className="text-[11px] text-slate-400 italic px-2">✨ Trợ lý AI đang thực thi...</div>
              )}
            </div>

            <div className="p-3 border-t border-[#27272a] bg-[#141416] shrink-0">
              <form
                onSubmit={(e) => { e.preventDefault(); sendMessage(); }}
                className="rounded-2xl border border-[#3f3f46] bg-[#121214] p-2.5 flex flex-col gap-2 focus-within:border-orange-500 transition-colors"
              >
                {attachedImage && (
                  <div className="flex items-center gap-2 pb-1">
                    <div className="relative">
                      <img src={attachedImage} alt="Preview" className="w-12 h-12 object-cover rounded-xl border border-orange-500/50" />
                      <button
                        type="button"
                        onClick={() => setAttachedImage('')}
                        className="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-rose-600 text-white text-[10px] flex items-center justify-center font-bold"
                      >
                        ✕
                      </button>
                    </div>
                    <span className="text-[10px] text-emerald-400">Đã đính kèm ảnh sản phẩm</span>
                  </div>
                )}

                {(excelRows.length > 0 || Object.keys(folderImages).length > 0) && (
                  <div className="flex flex-wrap items-center gap-1.5 pb-1">
                    {excelRows.length > 0 && (
                      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-950/80 border border-emerald-700/60 text-emerald-300 text-[10px] font-bold">
                        📊 {excelFileName} ({excelRows.length} dòng)
                        <button type="button" onClick={() => { setExcelFileName(''); setExcelRows([]); }} className="ml-1 text-rose-400">✕</button>
                      </span>
                    )}
                    {Object.keys(folderImages).length > 0 && (
                      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-indigo-950/80 border border-indigo-700/60 text-indigo-300 text-[10px] font-bold">
                        📁 {Math.round(Object.keys(folderImages).length / 2)} ảnh trong thư mục
                        <button type="button" onClick={() => setFolderImages({})} className="ml-1 text-rose-400">✕</button>
                      </span>
                    )}
                  </div>
                )}

                <textarea
                  rows={2}
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                      e.preventDefault();
                      sendMessage();
                    }
                  }}
                  placeholder="Nhập lệnh cho Trợ lý AI (Enter để gửi)..."
                  className="w-full resize-none bg-transparent text-xs text-slate-100 outline-none placeholder:text-slate-500 px-1"
                />

                <div className="flex items-center justify-between pt-1">
                  <div className="relative flex items-center gap-1.5">
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept="image/*"
                      onChange={handlePickImage}
                      className="hidden"
                    />
                    <input
                      ref={excelInputRef}
                      type="file"
                      accept=".xlsx,.xls,.csv"
                      onChange={handlePickExcel}
                      className="hidden"
                    />
                    <input
                      ref={folderInputRef}
                      type="file"
                      webkitdirectory=""
                      directory=""
                      multiple
                      accept="image/*"
                      onChange={handlePickImageFolder}
                      className="hidden"
                    />
                    <button
                      type="button"
                      onClick={() => setAttachMenuOpen((v) => !v)}
                      title="Đính kèm ảnh, file Excel hoặc thư mục ảnh"
                      className="w-8 h-8 rounded-full bg-[#27272a] hover:bg-[#323238] border border-[#3f3f46] text-slate-200 flex items-center justify-center text-sm font-bold"
                    >
                      +
                    </button>
                    {attachMenuOpen && (
                      <div className="absolute bottom-10 left-0 w-44 rounded-xl bg-[#18181b] border border-[#3f3f46] shadow-xl p-1.5 z-50 flex flex-col gap-0.5 text-xs">
                        <button
                          type="button"
                          onClick={() => { setAttachMenuOpen(false); fileInputRef.current && fileInputRef.current.click(); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#27272a] text-slate-200 flex items-center gap-2 font-medium"
                        >
                          <span>📷</span><span>Chọn ảnh</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => { setAttachMenuOpen(false); excelInputRef.current && excelInputRef.current.click(); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#27272a] text-emerald-400 flex items-center gap-2 font-medium"
                        >
                          <span>📊</span><span>Chọn file Excel</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => { setAttachMenuOpen(false); folderInputRef.current && folderInputRef.current.click(); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#27272a] text-indigo-300 flex items-center gap-2 font-medium"
                        >
                          <span>📁</span><span>Chọn thư mục ảnh</span>
                        </button>
                      </div>
                    )}
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    title="Gửi"
                    className="w-8 h-8 rounded-full bg-orange-600 hover:bg-orange-500 text-white flex items-center justify-center text-sm font-bold disabled:opacity-50 shadow-sm"
                  >
                    →
                  </button>
                </div>
              </form>
            </div>
            </div>
          </aside>
        );
      }

      function CatDialogHost() {
        const [dlg, setDlg] = useState(null);

        useEffect(() => {
          window.__catAlert = (msg) => {
            setDlg({ mode: 'alert', message: String(msg || ''), resolve: null });
          };
          window.alert = (msg) => {
            window.__catAlert(msg);
          };
          window.catConfirm = (msg) =>
            new Promise((resolve) => {
              setDlg({ mode: 'confirm', message: String(msg || ''), resolve });
            });
        }, []);

        if (!dlg) return null;

        const closeWith = (val) => {
          const fn = dlg.resolve;
          setDlg(null);
          if (fn) fn(val);
        };

        return (
          <div
            onClick={() => closeWith(false)}
            className="fixed inset-0 z-[200] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
          >
            <div
              onClick={(e) => e.stopPropagation()}
              className="w-full max-w-sm rounded-3xl bg-white border-2 border-orange-200 shadow-2xl p-6 text-center space-y-4"
            >
              <div className="w-14 h-14 mx-auto rounded-2xl bg-orange-100 border border-orange-200 flex items-center justify-center text-3xl shadow-sm">
                🐱
              </div>
              <div className="space-y-1.5">
                <h4 className="text-base font-extrabold text-slate-900">
                  {dlg.mode === 'confirm' ? 'Xác nhận thao tác' : 'Thông báo Mèo Cưng'}
                </h4>
                <p className="text-sm text-slate-600 leading-relaxed whitespace-pre-line">{dlg.message}</p>
              </div>
              <div className="flex items-center justify-center gap-2.5 pt-2">
                {dlg.mode === 'confirm' && (
                  <button
                    type="button"
                    onClick={() => closeWith(false)}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors"
                  >
                    Hủy
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => closeWith(true)}
                  className="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold text-xs shadow-md shadow-orange-200 transition-all"
                >
                  {dlg.mode === 'confirm' ? 'Đồng ý' : 'Đã hiểu'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(
        <React.Fragment>
          <SingleUnifiedDashboard />
          <CatDialogHost />
        </React.Fragment>
      );
    </script>
</body>
</html>
