                        <tbody className="divide-y divide-[#27272a] text-xs">
                          {filtered.map((p) => (
                            <tr key={p.id} className="hover:bg-[#202024]/60 transition-colors">
                              <td className="py-3.5 px-6 flex items-center gap-3">
                                <img src={p.image} alt={p.name} className="w-11 h-11 rounded-lg object-cover bg-[#121214] border border-[#27272a] shrink-0" />
                                <div>
                                  <div className="font-bold text-slate-100 text-sm line-clamp-1">{p.name}</div>
                                  <div className="text-[10px] text-slate-500 font-mono">Quy cách: {p.weight || '1kg'}</div>
                                </div>
                              </td>
                              <td className="py-3.5 px-6">
                                <span className="text-[10px] font-bold text-purple-400 bg-purple-950/60 border border-purple-800/50 px-2 py-0.5 rounded">
                                  🏪 {p.vendor}
                                </span>
                              </td>
                              <td className="py-3.5 px-6 text-slate-300">
                                {p.categoryName || 'Thức ăn hạt'}
                              </td>
                              <td className="py-3.5 px-6 font-bold text-orange-400 text-sm">
                                {Number(p.price).toLocaleString('vi-VN')} ₫
                              </td>
                              <td className="py-3.5 px-6 text-slate-300">
                                <span className="font-bold text-slate-100">{p.inventory || 100}</span> gói/hộp
                              </td>
                              <td className="py-3.5 px-6">
                                <span className="text-[10px] font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2 py-0.5 rounded-full">
                                  ● Published
                                </span>
                              </td>
                              <td className="py-3.5 px-6 text-right space-x-1.5">
                                <button
                                  onClick={() => handleOpenEdit(p)}
                                  className="px-2.5 py-1 font-bold text-blue-400 hover:text-blue-300 bg-blue-950/60 border border-blue-800/40 rounded"
                                >
                                  Sửa
                                </button>
                                <button
                                  onClick={() => handleDelete(p.id)}
                                  className="px-2.5 py-1 font-bold text-rose-400 hover:text-rose-300 bg-rose-950/60 border border-rose-800/40 rounded"
                                >
                                  Xóa
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* TAB ORDERS */}
                {activeTab === 'orders' && (
                  <div className="bg-[#18181b] rounded-xl border border-[#27272a] p-6 max-w-7xl mx-auto space-y-4">
                    <h3 className="font-bold text-slate-100 text-sm">Đơn Hàng Gần Nhất (Medusa Fulfillment Pipeline)</h3>
                    <div className="divide-y divide-[#27272a] text-xs">
                      <div className="py-3.5 flex justify-between items-center">
                        <div>
                          <p className="font-bold text-slate-100 text-sm">Nguyễn Văn An • 0912 345 678</p>
                          <p className="text-slate-400 text-[11px]">Đơn: Hạt Royal Canin Fit 32 (2kg) - Mã: ORD-9821</p>
                        </div>
                        <div className="text-right">
                          <p className="font-bold text-orange-400 text-sm">185.000 ₫</p>
                          <span className="text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full">Đã hoàn thành</span>
                        </div>
                      </div>
                      <div className="py-3.5 flex justify-between items-center">
                        <div>
                          <p className="font-bold text-slate-100 text-sm">Trần Thị Mai • 0988 776 554</p>
                          <p className="text-slate-400 text-[11px]">Đơn: Pate Ciao Churu Gói 4 thanh - Mã: ORD-9822</p>
                        </div>
                        <div className="text-right">
                          <p className="font-bold text-orange-400 text-sm">90.000 ₫</p>
                          <span className="text-[10px] font-bold bg-blue-950 text-blue-400 border border-blue-800 px-2 py-0.5 rounded-full">Đang vận chuyển</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB PAYLOAD CMS BÀI VIẾT NATIVE IFRAME */}
                {activeTab === 'payload_posts' && (
                  <div className="w-full h-[calc(100vh-100px)] rounded-xl border border-[#27272a] overflow-hidden bg-white">
                    <iframe src={`${PAYLOAD_ADMIN_URL}/collections/posts`} className="w-full h-full border-0" title="Payload Posts" />
                  </div>
                )}

                {/* TAB PAYLOAD CMS BANNERS */}
                {activeTab === 'payload_banners' && (
                  <div className="w-full h-[calc(100vh-100px)] rounded-xl border border-[#27272a] overflow-hidden bg-white">
                    <iframe src={`${PAYLOAD_ADMIN_URL}/collections/banners`} className="w-full h-full border-0" title="Payload Banners" />
                  </div>
                )}

                {/* TAB PAYLOAD CMS COUPONS */}
                {activeTab === 'payload_coupons' && (
                  <div className="w-full h-[calc(100vh-100px)] rounded-xl border border-[#27272a] overflow-hidden bg-white">
                    <iframe src={`${PAYLOAD_ADMIN_URL}/collections/coupons`} className="w-full h-full border-0" title="Payload Coupons" />
                  </div>
                )}

                {/* TAB INVENTORY */}
                {activeTab === 'inventory' && (
                  <div className="bg-[#18181b] rounded-xl border border-[#27272a] p-6 max-w-7xl mx-auto">
                    <h3 className="font-bold text-slate-100 text-sm mb-4">Quản Lý Tồn Kho (Medusa Multi-Warehouse)</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                      <div className="p-4 bg-[#141416] border border-[#27272a] rounded-xl">
                        <div className="text-slate-400 font-bold">KHO TP. HỒ CHÍ MINH</div>
                        <div className="text-xl font-black text-slate-100 mt-1">1.250 gói/bao</div>
                        <div className="text-emerald-400 text-[10px] mt-1">● Sẵn sàng xuất kho</div>
                      </div>
                      <div className="p-4 bg-[#141416] border border-[#27272a] rounded-xl">
                        <div className="text-slate-400 font-bold">KHO HÀ NỘI</div>
                        <div className="text-xl font-black text-slate-100 mt-1">840 gói/bao</div>
                        <div className="text-emerald-400 text-[10px] mt-1">● Sẵn sàng xuất kho</div>
                      </div>
                      <div className="p-4 bg-[#141416] border border-[#27272a] rounded-xl">
                        <div className="text-slate-400 font-bold">KHO ĐÀ NẴNG</div>
                        <div className="text-xl font-black text-slate-100 mt-1">420 gói/bao</div>
                        <div className="text-emerald-400 text-[10px] mt-1">● Sẵn sàng xuất kho</div>
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB CUSTOMERS */}
                {activeTab === 'customers' && (
                  <div className="bg-[#18181b] rounded-xl border border-[#27272a] p-6 max-w-7xl mx-auto space-y-3">
                    <h3 className="font-bold text-slate-100 text-sm">Khách Hàng Đăng Ký Tài Khoản</h3>
                    <div className="divide-y divide-[#27272a] text-xs">
                      <div className="py-3 flex justify-between">
                        <div>
                          <p className="font-bold text-slate-100">Nguyễn Văn An</p>
                          <p className="text-slate-400 font-mono text-[11px]">an.nguyen@gmail.com • 0912 345 678</p>
                        </div>
                        <span className="text-emerald-400 font-bold">3 đơn hàng</span>
                      </div>
                      <div className="py-3 flex justify-between">
                        <div>
                          <p className="font-bold text-slate-100">Trần Thị Mai</p>
                          <p className="text-slate-400 font-mono text-[11px]">mai.tran@gmail.com • 0988 776 554</p>
                        </div>
                        <span className="text-emerald-400 font-bold">2 đơn hàng</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </main>

            {/* MODAL THÊM / SỬA SẢN PHẨM PHÙ HỢP HOÀN TOÀN VỚI THỨC ĂN & PHỤ KIỆN MÈO */}
            {isModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-xs p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-lg w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">
                      {editingProduct ? 'Chỉnh Sửa Sản Phẩm Pet Shop' : 'Thêm Sản Phẩm Mới Vào Kho'}
                    </h3>
                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>

                  <form onSubmit={handleSave} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Tên sản phẩm hạt / pate / cát *</label>
                      <input
                        type="text"
                        required
                        value={form.name}
                        onChange={(e) => setForm({ ...form, name: e.target.value })}
                        placeholder="VD: Hạt Royal Canin Fit 32 2kg"
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Phân loại danh mục</label>
                        <select
                          value={form.category}
                          onChange={(e) => setForm({ ...form, category: e.target.value })}
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                        >
                          <option value="thuc-an-hat">Thức ăn hạt dinh dưỡng</option>
                          <option value="pate-cho-meo">Pate & Súp thưởng</option>
                          <option value="cat-ve-sinh">Cát vệ sinh & Khử mùi</option>
                          <option value="phu-kien">Phụ kiện & Đồ chơi</option>
                        </select>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Quy cách (Trọng lượng)</label>
                        <input
                          type="text"
                          value={form.weight}
                          onChange={(e) => setForm({ ...form, weight: e.target.value })}
                          placeholder="VD: 1kg, 2kg, 6L..."
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Giá bán (VNĐ) *</label>
                        <input
                          type="number"
                          required
                          value={form.price}
                          onChange={(e) => setForm({ ...form, price: Number(e.target.value) })}
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg font-bold text-orange-400 outline-none focus:border-orange-500"
                        />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Số lượng nhập kho</label>
                        <input
                          type="number"
                          value={form.inventory}
                          onChange={(e) => setForm({ ...form, inventory: Number(e.target.value) })}
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Thương hiệu / Nhà bán hàng</label>
                      <input
                        type="text"
                        value={form.vendor}
                        onChange={(e) => setForm({ ...form, vendor: e.target.value })}
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">URL Ảnh sản phẩm (Cloudflare R2 / S3)</label>
                      <input
                        type="url"
                        value={form.image}
                        onChange={(e) => setForm({ ...form, image: e.target.value })}
                        placeholder="https://..."
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Mô tả thành phần dinh dưỡng</label>
                      <textarea
                        rows={2}
                        value={form.description}
                        onChange={(e) => setForm({ ...form, description: e.target.value })}
                        placeholder="Hàm lượng đạm, chất xơ, vitamin, công dụng ngừa búi lông..."
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                      />
                    </div>

                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button
                        type="button"
                        onClick={() => setIsModalOpen(false)}
                        className="px-3.5 py-2 font-bold text-slate-400 hover:text-slate-200 bg-[#27272a] rounded-lg"
                      >
                        Hủy
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg shadow-sm"
                      >
                        Lưu Sản Phẩm Vào Kho
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<MedusaPayloadApp />);
    </script>
</body>
</html>
