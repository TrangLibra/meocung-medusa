      const INITIAL_POSTS = [];

      function SingleUnifiedDashboard() {
        const [activeTab, setActiveTab] = useState('products');
        
        // Khởi tạo sản phẩm từ localStorage để đồng bộ thời gian thực với Storefront và các tab
        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('meocung_custom_products');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch (e) {}
          return INITIAL_PRODUCTS;
        });
        const [searchQuery, setSearchQuery] = useState('');

        // Tự động lưu và phát broadcast event khi có thay đổi sản phẩm
        useEffect(() => {
          try {
            localStorage.setItem('meocung_custom_products', JSON.stringify(products));
            window.dispatchEvent(new Event('products_updated'));
          } catch (e) {}
        }, [products]);

        // Dữ liệu PayloadCMS nạp trực tiếp qua Native REST API (Hoàn toàn không dùng iFrame, KHÔNG CẦN LOGIN)
        const [posts, setPosts] = useState(INITIAL_POSTS);
        const [postsLoading, setPostsLoading] = useState(false);
        const [postSearch, setPostSearch] = useState('');

        // Quản lý tài khoản khách hàng (lưu trực tiếp trên Neon PostgreSQL)
        const [customers, setCustomers] = useState([]);
        const [customersLoading, setCustomersLoading] = useState(false);
        const [customerError, setCustomerError] = useState('');
        const [customerSearch, setCustomerSearch] = useState('');
        const [customerStatusFilter, setCustomerStatusFilter] = useState('all');
        const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
        const [editingCustomer, setEditingCustomer] = useState(null);
        const [customerForm, setCustomerForm] = useState({ name: '', email: '', phone: '', password: '', status: 'active' });
        const [customerApiBase, setCustomerApiBase] = useState(
          window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api/admin/customers'
            : `${STOREFRONT_URL}/api/admin/customers`
        );

        const fetchCustomers = async (overrideSearch, overrideStatus) => {
          setCustomersLoading(true);
          setCustomerError('');
          const qVal = overrideSearch !== undefined ? overrideSearch : customerSearch;
          const stVal = overrideStatus !== undefined ? overrideStatus : customerStatusFilter;
          const params = new URLSearchParams();
          if (qVal.trim()) params.set('q', qVal.trim());
          if (stVal !== 'all') params.set('status', stVal);
          const qs = params.toString() ? `?${params.toString()}` : '';

          const candidates = window.location.hostname === 'localhost'
            ? ['http://localhost:3000/api/admin/customers', 'https://meocung-ecommerce-atoan.vercel.app/api/admin/customers', `${STOREFRONT_URL}/api/admin/customers`]
            : ['https://meocung-ecommerce-atoan.vercel.app/api/admin/customers', `${STOREFRONT_URL}/api/admin/customers`];

          for (const base of candidates) {
            try {
              const res = await fetch(`${base}${qs}`);
              if (res.ok) {
                const data = await res.json();
                setCustomers(data.users || []);
                setCustomerApiBase(base);
                setCustomersLoading(false);
                return;
              }
            } catch (_) {}
          }
          setCustomerError('Chưa kết nối được API Neon (/api/admin/customers). Hãy chạy meocung-ecommerce-main ở cổng 3000 hoặc deploy lên Vercel.');
          setCustomersLoading(false);
        };

        useEffect(() => {
          if (activeTab === 'customers') {
            fetchCustomers();
          }
        }, [activeTab, customerStatusFilter]);

        const handleOpenCreateCustomer = () => {
          setEditingCustomer(null);
          setCustomerForm({ name: '', email: '', phone: '', password: '', status: 'active' });
          setIsCustomerModalOpen(true);
        };

        const handleOpenEditCustomer = (c) => {
          setEditingCustomer(c);
          setCustomerForm({ name: c.name || '', email: c.email || '', phone: c.phone || '', password: '', status: c.status || 'active' });
          setIsCustomerModalOpen(true);
        };

        const handleSaveCustomer = async (e) => {
          e.preventDefault();
          try {
            const url = editingCustomer ? `${customerApiBase}/${editingCustomer.id}` : customerApiBase;
            const method = editingCustomer ? 'PATCH' : 'POST';
            const payload = {
              name: customerForm.name,
              email: customerForm.email,
              phone: customerForm.phone,
              status: customerForm.status,
            };
            if (customerForm.password) payload.password = customerForm.password;
            const res = await fetch(url, {
              method,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.error || 'Không thể lưu tài khoản!');
            setIsCustomerModalOpen(false);
            fetchCustomers();
          } catch (_e) {
            alert('Lỗi kết nối tới API Neon!');
          }
        };

        const handleToggleCustomerStatus = async (c) => {
          const nextStatus = c.status === 'active' ? 'blocked' : 'active';
          try {
            const res = await fetch(`${customerApiBase}/${c.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: nextStatus }),
            });
            if (res.ok) fetchCustomers();
          } catch (_e) {}
        };

        const handleDeleteCustomer = async (c) => {
          if (!confirm(`Xóa vĩnh viễn tài khoản ${c.email} khỏi Neon PostgreSQL?`)) return;
          try {
            const res = await fetch(`${customerApiBase}/${c.id}`, { method: 'DELETE' });
            if (res.ok) fetchCustomers();
          } catch (_e) {}
        };

        // Quản lý đơn hàng & vận chuyển (lưu trực tiếp trên Neon PostgreSQL)
        const [orders, setOrders] = useState([]);
        const [ordersLoading, setOrdersLoading] = useState(false);
        const [orderError, setOrderError] = useState('');
        const [orderSearch, setOrderSearch] = useState('');
        const [orderStatusFilter, setOrderStatusFilter] = useState('all');
        const [orderApiBase, setOrderApiBase] = useState(
          window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api/admin/orders'
            : `${STOREFRONT_URL}/api/admin/orders`
        );

        const ORDER_STATUS_LABELS = {
          pending: { label: 'Chờ xác nhận', cls: 'bg-amber-950 text-amber-400 border-amber-800/50' },
          confirmed: { label: 'Đã xác nhận', cls: 'bg-indigo-950 text-indigo-400 border-indigo-800/50' },
          shipping: { label: 'Đang vận chuyển', cls: 'bg-blue-950 text-blue-400 border-blue-800/50' },
          delivered: { label: 'Đã giao hàng', cls: 'bg-emerald-950 text-emerald-400 border-emerald-800/50' },
          cancelled: { label: 'Đã hủy', cls: 'bg-rose-950 text-rose-400 border-rose-800/50' },
        };

        const fetchOrders = async (overrideSearch, overrideStatus) => {
          setOrdersLoading(true);
          setOrderError('');
          const qVal = overrideSearch !== undefined ? overrideSearch : orderSearch;
          const stVal = overrideStatus !== undefined ? overrideStatus : orderStatusFilter;
          const params = new URLSearchParams();
          if (qVal.trim()) params.set('q', qVal.trim());
          if (stVal !== 'all') params.set('status', stVal);
          const qs = params.toString() ? `?${params.toString()}` : '';

          const candidates = window.location.hostname === 'localhost'
            ? ['http://localhost:3000/api/admin/orders', 'https://meocung-ecommerce-atoan.vercel.app/api/admin/orders', `${STOREFRONT_URL}/api/admin/orders`]
            : ['https://meocung-ecommerce-atoan.vercel.app/api/admin/orders', `${STOREFRONT_URL}/api/admin/orders`];

          for (const base of candidates) {
            try {
              const res = await fetch(`${base}${qs}`);
              if (res.ok) {
                const data = await res.json();
                setOrders(data.orders || []);
                setOrderApiBase(base);
                setOrdersLoading(false);
                return;
              }
            } catch (_) {}
          }
          setOrderError('Chưa kết nối được API đơn hàng Neon (/api/admin/orders).');
          setOrdersLoading(false);
        };

        useEffect(() => {
          fetchOrders();
          fetchCustomers();
        }, []);

        useEffect(() => {
          if (activeTab === 'orders') {
            fetchOrders();
          }
        }, [activeTab, orderStatusFilter]);

        const handleUpdateOrderStatus = async (order, nextStatus) => {
          try {
            const res = await fetch(`${orderApiBase}/${order.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: nextStatus }),
            });
            if (res.ok) fetchOrders();
          } catch (_e) {}
        };

        const handleUpdateTracking = async (order) => {
          const code = prompt(`Nhập mã vận đơn cho đơn #${order.order_code}:`, order.tracking_code || '');
          if (code === null) return;
          try {
            const res = await fetch(`${orderApiBase}/${order.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tracking_code: code.trim() }),
            });
            if (res.ok) fetchOrders();
          } catch (_e) {}
        };

        const handleDeleteOrder = async (order) => {
          if (!confirm(`Xóa đơn hàng #${order.order_code} khỏi Neon PostgreSQL?`)) return;
          try {
            const res = await fetch(`${orderApiBase}/${order.id}`, { method: 'DELETE' });
            if (res.ok) fetchOrders();
          } catch (_e) {}
        };

        // Quản lý Mã Giảm Giá & Voucher (lưu trực tiếp bảng public.voucher trên Neon PostgreSQL)
        const [vouchers, setVouchers] = useState([]);
        const [vouchersLoading, setVouchersLoading] = useState(false);
        const [voucherError, setVoucherError] = useState('');
        const [voucherSearch, setVoucherSearch] = useState('');
        const [voucherTypeFilter, setVoucherTypeFilter] = useState('all');
        const [isVoucherModalOpen, setIsVoucherModalOpen] = useState(false);
        const [editingVoucher, setEditingVoucher] = useState(null);
        const [voucherForm, setVoucherForm] = useState({
          code: '',
          title: '',
          type: 'percent',
          discount_value: 10,
          min_order: 150000,
          max_uses: '',
          expires_at: '',
          is_active: true,
        });

                              )}
                              <div>
                                <label className="block text-slate-400 font-bold mb-1">Đơn tối thiểu (VNĐ)</label>
                                <input
                                  type="number"
                                  min="0"
                                  value={voucherForm.min_order}
                                  onChange={(e) => setVoucherForm({ ...voucherForm, min_order: e.target.value })}
                                  className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                                />
                              </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                              <div>
                                <label className="block text-slate-400 font-bold mb-1">Giới hạn lượt dùng</label>
                                <input
                                  type="number"
                                  min="1"
                                  value={voucherForm.max_uses}
                                  onChange={(e) => setVoucherForm({ ...voucherForm, max_uses: e.target.value })}
                                  className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                                  placeholder="Để trống = Không giới hạn"
                                />
                              </div>
                              <div>
                                <label className="block text-slate-400 font-bold mb-1">Ngày hết hạn</label>
                                <input
                                  type="date"
                                  value={voucherForm.expires_at}
                                  onChange={(e) => setVoucherForm({ ...voucherForm, expires_at: e.target.value })}
                                  className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                                />
                              </div>
                            </div>
                            <div className="flex justify-end gap-2 pt-2">
                              <button type="button" onClick={() => setIsVoucherModalOpen(false)} className="px-4 py-2 rounded-lg bg-[#27272a] text-slate-300 font-bold">
                                Hủy
                              </button>
                              <button type="submit" className="px-4 py-2 rounded-lg bg-orange-600 hover:bg-orange-500 text-white font-bold">
                                {editingVoucher ? 'Lưu Thay Đổi' : 'Lưu Vào Neon'}
                              </button>
                            </div>
                          </form>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* 6. TAB CUSTOMERS (NEON POSTGRESQL) */}
                {activeTab === 'customers' && (
                  <div className="space-y-4 max-w-7xl mx-auto">
                    <div className="bg-[#18181b] rounded-xl border border-[#27272a] p-4 flex flex-wrap items-center justify-between gap-3">
                      <div className="flex flex-wrap items-center gap-2.5 flex-1">
                        <input
                          type="text"
                          value={customerSearch}
                          onChange={(e) => setCustomerSearch(e.target.value)}
                          onKeyDown={(e) => { if (e.key === 'Enter') fetchCustomers(); }}
                          placeholder="Tìm theo tên, email, SĐT trên Neon..."
                          className="w-72 px-3 py-1.5 text-xs rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-200 focus:outline-none focus:border-orange-500"
                        />
                        <select
                          value={customerStatusFilter}
                          onChange={(e) => setCustomerStatusFilter(e.target.value)}
                          className="px-3 py-1.5 text-xs rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-200"
                        >
                          <option value="all">Tất cả trạng thái</option>
                          <option value="active">Hoạt động</option>
                          <option value="blocked">Đã khóa</option>
                        </select>
                        <button
                          onClick={() => fetchCustomers()}
                          className="px-3 py-1.5 text-xs font-bold bg-[#27272a] hover:bg-[#323238] text-slate-200 rounded-lg border border-[#3f3f46]"
                        >
                          🔍 Tìm
                        </button>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-[11px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800/50 px-2.5 py-1 rounded-full">
                          🐘 Neon PostgreSQL • {customers.length} tài khoản
                        </span>
                        <button
                          onClick={handleOpenCreateCustomer}
                          className="px-3.5 py-1.5 text-xs font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg shadow-sm"
                        >
                          ➕ Thêm Tài Khoản
                        </button>
                      </div>
                    </div>

                    {customerError && (
                      <div className="p-3 rounded-xl bg-red-950/60 border border-red-800/50 text-red-400 text-xs font-medium">
                        ⚠️ {customerError}
                      </div>
                    )}

                    <div className="bg-[#18181b] rounded-xl border border-[#27272a] overflow-hidden">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="border-b border-[#27272a] text-[10px] uppercase tracking-wider text-slate-400 bg-[#141416]">
                            <th className="py-3 px-4">Khách Hàng</th>
                            <th className="py-3 px-4">Số Điện Thoại</th>
                            <th className="py-3 px-4">Trạng Thái</th>
                            <th className="py-3 px-4">Đăng Nhập Gần Nhất</th>
                            <th className="py-3 px-4">Ngày Tạo</th>
                            <th className="py-3 px-4 text-right">Thao Tác</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-[#27272a]">
                          {customersLoading ? (
                            <tr><td colSpan="6" className="py-8 text-center text-slate-400">Đang tải danh sách tài khoản từ Neon PostgreSQL...</td></tr>
                          ) : customers.length === 0 ? (
                            <tr><td colSpan="6" className="py-8 text-center text-slate-400">Chưa có tài khoản khách hàng nào trong Neon PostgreSQL.</td></tr>
                          ) : customers.map((c) => (
                            <tr key={c.id} className="hover:bg-[#202024] transition-colors">
                              <td className="py-3 px-4">
                                <p className="font-bold text-slate-100">{c.name}</p>
                                <p className="text-slate-400 font-mono text-[11px]">{c.email}</p>
                              </td>
                              <td className="py-3 px-4 text-slate-300 font-mono">{c.phone || '—'}</td>
                              <td className="py-3 px-4">
                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${
                                  c.status === 'active'
                                    ? 'bg-emerald-950 text-emerald-400 border-emerald-800/50'
                                    : 'bg-rose-950 text-rose-400 border-rose-800/50'
                                }`}>
                                  {c.status === 'active' ? 'Hoạt động' : 'Đã khóa'}
                                </span>
                              </td>
                              <td className="py-3 px-4 text-slate-400">
                                {c.last_login_at ? new Date(c.last_login_at).toLocaleString('vi-VN') : 'Chưa đăng nhập'}
                              </td>
                              <td className="py-3 px-4 text-slate-400">
                                {c.created_at ? new Date(c.created_at).toLocaleString('vi-VN') : '—'}
                              </td>
                              <td className="py-3 px-4 text-right">
                                <div className="flex justify-end gap-1.5">
                                  <button
                                    onClick={() => handleOpenEditCustomer(c)}
                                    className="px-2.5 py-1 rounded-md text-[11px] font-bold bg-blue-950/60 text-blue-400 border border-blue-800/50 hover:opacity-80"
                                  >
                                    Sửa
                                  </button>
                                  <button
                                    onClick={() => handleToggleCustomerStatus(c)}
                                    className="px-2.5 py-1 rounded-md text-[11px] font-bold bg-amber-950/60 text-amber-400 border border-amber-800/50 hover:opacity-80"
                                  >
                                    {c.status === 'active' ? 'Khóa' : 'Mở'}
                                  </button>
                                  <button
                                    onClick={() => handleDeleteCustomer(c)}
                                    className="px-2.5 py-1 rounded-md text-[11px] font-bold bg-rose-950/60 text-rose-400 border border-rose-800/50 hover:opacity-80"
                                  >
                                    Xóa
                                  </button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    {isCustomerModalOpen && (
                      <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                        <div className="bg-[#18181b] rounded-2xl max-w-md w-full shadow-2xl border border-[#27272a] overflow-hidden">
                          <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                            <h3 className="font-bold text-sm text-slate-100">
                              {editingCustomer ? `Sửa Tài Khoản: ${editingCustomer.email}` : 'Thêm Tài Khoản Khách Hàng (Neon)'}
                            </h3>
                            <button onClick={() => setIsCustomerModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                          </div>
                          <form onSubmit={handleSaveCustomer} className="p-5 space-y-3 text-xs">
                            <div>
                              <label className="block text-slate-400 font-bold mb-1">Họ và tên *</label>
                              <input
                                required
                                value={customerForm.name}
                                onChange={(e) => setCustomerForm({ ...customerForm, name: e.target.value })}
                                className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                                placeholder="Nguyễn Văn A"
                              />
                            </div>
                            <div>
                              <label className="block text-slate-400 font-bold mb-1">Email *</label>
                              <input
                                type="email"
                                required
                                value={customerForm.email}
                                onChange={(e) => setCustomerForm({ ...customerForm, email: e.target.value })}
                                className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                                placeholder="khachhang@gmail.com"
                              />
                            </div>
                            <div>
                              <label className="block text-slate-400 font-bold mb-1">Số điện thoại</label>
                              <input
                                value={customerForm.phone}
                                onChange={(e) => setCustomerForm({ ...customerForm, phone: e.target.value })}
                                className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                                placeholder="0901234567"
                              />
                            </div>
                            <div>
                              <label className="block text-slate-400 font-bold mb-1">
                                {editingCustomer ? 'Mật khẩu mới (để trống nếu giữ nguyên)' : 'Mật khẩu * (tối thiểu 6 ký tự)'}
                              </label>
                              <input
                                type="password"
                                required={!editingCustomer}
                                value={customerForm.password}
                                onChange={(e) => setCustomerForm({ ...customerForm, password: e.target.value })}
                                className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                                placeholder="••••••"
                              />
                            </div>
                            <div>
                              <label className="block text-slate-400 font-bold mb-1">Trạng thái</label>
                              <select
                                value={customerForm.status}
                                onChange={(e) => setCustomerForm({ ...customerForm, status: e.target.value })}
                                className="w-full px-3 py-2 rounded-lg bg-[#121214] border border-[#3f3f46] text-slate-100"
                              >
                                <option value="active">Hoạt động</option>
                                <option value="blocked">Đã khóa</option>
                              </select>
                            </div>
                            <div className="flex justify-end gap-2 pt-2">
                              <button type="button" onClick={() => setIsCustomerModalOpen(false)} className="px-4 py-2 rounded-lg bg-[#27272a] text-slate-300 font-bold">
                                Hủy
                              </button>
                              <button type="submit" className="px-4 py-2 rounded-lg bg-orange-600 hover:bg-orange-500 text-white font-bold">
                                {editingCustomer ? 'Lưu Thay Đổi' : 'Tạo Tài Khoản'}
                              </button>
                            </div>
                          </form>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </main>

            {/* MODAL SẢN PHẨM MEDUSA */}
            {isProductModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-xs p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-lg w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">
                      {editingProduct ? 'Chỉnh Sửa Sản Phẩm Pet Shop' : 'Thêm Sản Phẩm Mới Vào Kho'}
                    </h3>
                    <button onClick={() => setIsProductModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>

                  <form onSubmit={handleSaveProduct} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Tên sản phẩm *</label>
                      <input
                        type="text"
                        required
                        value={productForm.name}
                        onChange={(e) => setProductForm({ ...productForm, name: e.target.value })}
                        placeholder="VD: Hạt Royal Canin Fit 32 2kg"
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Danh mục</label>
                        <select
                          value={productForm.category}
                          onChange={(e) => setProductForm({ ...productForm, category: e.target.value })}
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                        >
                          <option value="thuc-an-hat">Thức ăn hạt dinh dưỡng</option>
                          <option value="pate-cho-meo">Pate & Súp thưởng</option>
                          <option value="cat-ve-sinh">Cát vệ sinh & Khử mùi</option>
                          <option value="phu-kien">Phụ kiện & Đồ chơi</option>
                        </select>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Quy cách (Trọng lượng)</label>
                        <input
                          type="text"
                          value={productForm.weight}
                          onChange={(e) => setProductForm({ ...productForm, weight: e.target.value })}
                          placeholder="VD: 1kg, 2kg, 6L..."
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Giá bán (VNĐ) *</label>
                        <input
                          type="number"
                          required
                          value={productForm.price}
                          onChange={(e) => setProductForm({ ...productForm, price: Number(e.target.value) })}
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg font-bold text-orange-400 outline-none focus:border-orange-500"
                        />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-300 uppercase mb-1">Số lượng tồn kho</label>
                        <input
                          type="number"
                          value={productForm.inventory}
                          onChange={(e) => setProductForm({ ...productForm, inventory: Number(e.target.value) })}
                          className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                        />
                      </div>
                    </div>

                    <div className="space-y-2">
                      <label className="block font-bold text-slate-300 uppercase">Ảnh sản phẩm (Chọn file ảnh hoặc dán link)</label>
                      <div className="flex items-center gap-2">
                        <label className="shrink-0 cursor-pointer px-3 py-2 rounded-lg bg-[#27272a] hover:bg-[#323238] border border-[#3f3f46] text-slate-200 font-bold text-xs transition">
                          📁 Chọn ảnh từ máy
                          <input
                            type="file"
                            accept="image/*"
                            className="hidden"
                            onChange={(e) => {
                              const file = e.target.files && e.target.files[0];
                              if (!file) return;
                              const reader = new FileReader();
                              reader.onload = () => {
                                if (typeof reader.result === 'string') {
                                  setProductForm((prev) => ({ ...prev, image: reader.result }));
                                }
                              };
                              reader.readAsDataURL(file);
                            }}
                          />
                        </label>
                        <input
                          type="text"
                          value={productForm.image && productForm.image.startsWith('data:') ? '' : (productForm.image || '')}
                          onChange={(e) => setProductForm({ ...productForm, image: e.target.value })}
                          placeholder="Hoặc dán link ảnh (https://...)"
                          className="flex-1 bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-orange-500"
                        />
                      </div>
                      {productForm.image && (
                        <div className="flex items-center gap-3 p-2 rounded-lg bg-[#121214] border border-[#27272a]">
                          <img src={productForm.image} alt="Xem trước" className="w-12 h-12 rounded-lg object-cover border border-[#3f3f46]" />
                          <span className="text-[11px] text-slate-400 truncate flex-1">
                            {productForm.image.startsWith('data:') ? 'Đã chọn ảnh từ máy tính' : productForm.image}
                          </span>
                          <button
                            type="button"
                            onClick={() => setProductForm({ ...productForm, image: '' })}
                            className="px-2 py-1 rounded text-[11px] font-bold bg-rose-950/60 text-rose-400 border border-rose-800/50"
                          >
                            Xóa
                          </button>
                        </div>
                      )}
                    </div>

                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button
                        type="button"
                        onClick={() => setIsProductModalOpen(false)}
                        className="px-3.5 py-2 font-bold text-slate-400 hover:text-slate-200 bg-[#27272a] rounded-lg"
                      >
                        Hủy
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg shadow-sm"
                      >
                        Lưu Sản Phẩm
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL BÀI VIẾT CẨM NANG PAYLOADCMS */}
            {isPostModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-xs p-4">
                <div className="bg-[#18181b] rounded-2xl max-w-lg w-full shadow-2xl border border-[#27272a] overflow-hidden">
                  <div className="p-4 border-b border-[#27272a] flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-100">
                      {editingPost ? 'Chỉnh Sửa Bài Viết Cẩm Nang' : 'Viết Bài Cẩm Nang Mới'}
                    </h3>
                    <button onClick={() => setIsPostModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                  </div>

                  <form onSubmit={handleSavePost} className="p-5 space-y-3.5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Tiêu đề bài viết *</label>
                      <input
                        type="text"
                        required
                        value={postForm.title}
                        onChange={(e) => setPostForm({ ...postForm, title: e.target.value })}
                        placeholder="VD: Bí quyết chăm sóc mèo con mới sinh..."
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Chuyên mục</label>
                      <select
                        value={postForm.category}
                        onChange={(e) => setPostForm({ ...postForm, category: e.target.value })}
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      >
                        <option value="thuc-an-hat">Thức ăn hạt dinh dưỡng</option>
                        <option value="pate-cho-meo">Pate & Súp thưởng</option>
                        <option value="cat-ve-sinh">Cát vệ sinh & Khử mùi</option>
                        <option value="kinh-nghiem">Kinh nghiệm nuôi mèo</option>
                        <option value="giong-meo">Giống mèo</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Tóm tắt nội dung cẩm nang</label>
                      <textarea
                        rows={3}
                        value={postForm.summary}
                        onChange={(e) => setPostForm({ ...postForm, summary: e.target.value })}
                        placeholder="Tóm tắt lời khuyên dinh dưỡng hoặc kinh nghiệm..."
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">URL Ảnh bìa bài viết</label>
                      <input
                        type="url"
                        value={postForm.coverImage}
                        onChange={(e) => setPostForm({ ...postForm, coverImage: e.target.value })}
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      />
                    </div>

                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button
                        type="button"
                        onClick={() => setIsPostModalOpen(false)}
                        className="px-3.5 py-2 font-bold text-slate-400 hover:text-slate-200 bg-[#27272a] rounded-lg"
                      >
                        Hủy
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-sm"
                      >
                        Lưu Bài Viết
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<SingleUnifiedDashboard />);
    </script>
</body>
</html>
