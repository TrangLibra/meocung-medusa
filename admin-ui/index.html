        // Khởi tạo sản phẩm từ localStorage để đồng bộ thời gian thực với Storefront và các tab
        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('meocung_custom_products');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch (e) {}
          return INITIAL_PRODUCTS;
        });
        const [searchQuery, setSearchQuery] = useState('');

        // Tự động lưu và phát broadcast event khi có thay đổi sản phẩm
        useEffect(() => {
          try {
            localStorage.setItem('meocung_custom_products', JSON.stringify(products));
            window.dispatchEvent(new Event('products_updated'));
          } catch (e) {}
        }, [products]);

        // Dữ liệu PayloadCMS nạp trực tiếp qua Native REST API (Hoàn toàn không dùng iFrame, KHÔNG CẦN LOGIN)

        const [postsLoading, setPostsLoading] = useState(false);
        const [postSearch, setPostSearch] = useState('');

        // Modal sản phẩm Medusa
        const [isProductModalOpen, setIsProductModalOpen] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [productForm, setProductForm] = useState({
          name: '',
          category: 'thuc-an-hat',
          price: 150000,
          weight: '1kg',
          inventory: 100,
          vendor: 'Mèo Cưng Official',
          image: 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
          description: ''
        });

        // Modal bài viết cẩm nang PayloadCMS
        const [isPostModalOpen, setIsPostModalOpen] = useState(false);
        const [editingPost, setEditingPost] = useState(null);
        const [postForm, setPostForm] = useState({
          title: '',
          category: 'kinh-nghiem',
          summary: '',
          coverImage: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800',
          status: 'published'
        });

        // Load bài viết trực tiếp từ Payload REST API
        const fetchPayloadPosts = async () => {
          setPostsLoading(true);
          try {
            // Thử nạp qua API admin của storefront trước (có sẵn 100 bài từ DB)
            let res = await fetch(`https://meocung-ecommerce-seven.vercel.app/api/admin/posts`);
            if (res.ok) {
              const data = await res.json();
              if (data && data.docs && data.docs.length > 0) {
                const formatted = data.docs.map(item => ({
                  id: item.id,
                  title: item.title,
                  category: item.category || 'kinh-nghiem',
                  summary: item.summary || (item.content ? item.content.replace(/<[^>]*>?/gm, '').slice(0, 120) + '...' : ''),
                  coverImage: item.image || item.coverImage || 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800',
                  status: item.status || 'published'
                }));
                setPosts(formatted);
                setPostsLoading(false);
                return;
              }
            }
            
            // Fallback sang Payload backend direct API
            res = await fetch(`https://meocung-payload.vercel.app/api/posts?limit=100`);
            if (res.ok) {
              const data = await res.json();
              if (data && data.docs) {
                setPosts(data.docs);
              }
            }
          } catch (err) {
            console.error('Fetch posts error:', err);
          } finally {
            setPostsLoading(false);
          }
        };

        useEffect(() => {
          fetchPayloadPosts();
        }, []);

        // Xử lý tạo / sửa sản phẩm Medusa
        const handleOpenCreateProduct = () => {
          setEditingProduct(null);
          setProductForm({
            name: '',
            category: 'thuc-an-hat',
            price: 150000,
            weight: '1kg',
            inventory: 100,
            vendor: 'Mèo Cưng Official',
            image: 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800',
            description: ''
          });
          setIsProductModalOpen(true);
        };

        const handleOpenEditProduct = (p) => {
          setEditingProduct(p);
          setProductForm({
            name: p.name,
            category: p.category || 'thuc-an-hat',
            price: p.price,
            weight: p.weight || '1kg',
            inventory: p.inventory || 100,
            vendor: p.vendor || 'Mèo Cưng Official',
            image: p.image || '',
            description: p.description || ''
          });

          if (!confirm('Xác nhận xóa sản phẩm khỏi kho hàng?')) return;
          setProducts(products.filter(p => p.id !== id));
        };

          e.preventDefault();
          if (!productForm.name.trim()) return alert('Vui lòng nhập tên sản phẩm!');

            'thuc-an-hat': 'Thức ăn hạt dinh dưỡng',
            'pate-cho-meo': 'Pate & Súp thưởng',
            'cat-ve-sinh': 'Cát vệ sinh & Khử mùi',
            'phu-kien': 'Phụ kiện & Đồ chơi'
          };

          if (editingProduct) {
            setProducts(products.map(p => p.id === editingProduct.id ? { ...p, ...productForm, categoryName: catNames[productForm.category] } : p));

            const newP = {
              id: `prod_${Date.now()}`,
              ...productForm,
              categoryName: catNames[productForm.category],
              status: 'published'

          setIsProductModalOpen(false);

            title: post.title,
            category: post.category || 'kinh-nghiem',
            summary: post.summary || '',
            coverImage: post.coverImage || '',
            status: post.status || 'published'

          if (!confirm('Xác nhận xóa bài viết này khỏi cẩm nang?')) return;
          setPosts(posts.filter(p => p.id !== id));

              publishedAt: new Date().toISOString()

                      <span className="text-[9px] bg-orange-950 text-orange-400 font-mono px-1 rounded">E-COM</span>
                    </div>
                    <div className="space-y-0.5">
                      <button
                        onClick={() => setActiveTab('products')}

                      <button

                  <div>
                    <div className="px-3 pb-1 text-[10px] font-bold text-indigo-400 uppercase tracking-wider flex items-center justify-between">
                      <span>📝 PAYLOAD CMS NATIVE</span>

                    <div className="space-y-0.5">

                  <form onSubmit={handleSavePost} className="p-5 space-y-3.5 text-xs">

                      <label className="block font-bold text-slate-300 uppercase mb-1">Tiêu đề bài viết *</label>
                      <input
                        type="text"
                        required
                        value={postForm.title}
                        onChange={(e) => setPostForm({ ...postForm, title: e.target.value })}
                        placeholder="VD: Bí quyết chăm sóc mèo con mới sinh..."
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Chuyên mục</label>
                      <select
                        value={postForm.category}
                        onChange={(e) => setPostForm({ ...postForm, category: e.target.value })}
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      >
                        <option value="thuc-an-hat">Thức ăn hạt dinh dưỡng</option>
                        <option value="pate-cho-meo">Pate & Súp thưởng</option>
                        <option value="cat-ve-sinh">Cát vệ sinh & Khử mùi</option>
                        <option value="kinh-nghiem">Kinh nghiệm nuôi mèo</option>
                        <option value="giong-meo">Giống mèo</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">Tóm tắt nội dung cẩm nang</label>
                      <textarea
                        rows={3}
                        value={postForm.summary}
                        onChange={(e) => setPostForm({ ...postForm, summary: e.target.value })}
                        placeholder="Tóm tắt lời khuyên dinh dưỡng hoặc kinh nghiệm..."
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-300 uppercase mb-1">URL Ảnh bìa bài viết</label>
                      <input
                        type="url"
                        value={postForm.coverImage}
                        onChange={(e) => setPostForm({ ...postForm, coverImage: e.target.value })}
                        className="w-full bg-[#121214] border border-[#27272a] px-3 py-2 rounded-lg text-slate-100 outline-none focus:border-indigo-500"
                      />
                    </div>

                    <div className="pt-3 flex justify-end gap-2 border-t border-[#27272a]">
                      <button
                        type="button"
                        onClick={() => setIsPostModalOpen(false)}
                        className="px-3.5 py-2 font-bold text-slate-400 hover:text-slate-200 bg-[#27272a] rounded-lg"
                      >
                        Hủy
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-sm"
                      >
                        Lưu Bài Viết
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<SingleUnifiedDashboard />);
    </script>
</body>
</html>
